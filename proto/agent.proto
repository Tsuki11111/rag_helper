syntax = "proto3";

option java_multiple_files = true;

package agent.v1;

// 询问链路 gRPC 契约（**字段源码即唯一权威**；说明性概览见 docs/architecture.md §4，
// 需求与对接前提见 docs/requirements.md §4；本文件是 Java 侧并行开发的接口凭据）
//
// 服务端：本仓库的 agent 服务（复用 run_main_agent，与 HTTP /query 同源）
// 调用方：Java 单体（内网；浏览器不直连 —— 见 evolution-plan §6）
// 身份走 metadata（等价 HTTP 头）：
//   authorization: Bearer <服务端密钥>
//   x-user-id: <平台顾客 ID>   （Java 注入时先剥离客户端同名值）
//
// 与旧草案（java-integration §14）的两处实质变化：
//   1. Confirm / Resume 消失 —— 产品确认由主 agent 的对话承接，每轮都是新 Converse
//   2. Progress 升级为 Trace —— 主 agent 与全部 subagent 的执行步骤统一为一种事件
//      （UI 直接渲染成灰色小字）

message ConverseRequest {
  string session_id = 1;   // 空则由服务端生成
  string message = 2;      // 用户消息（自然语言，可能包含订单号等）
  // 会话内表单回传（2026-11-07，方案 A）：用户提交的结构化字段值。
  // 服务端按 form_id 校验「本会话最近下发过、未过期、未消费」，并按 form_type 直接调工具；
  // 不传则是普通文本对话。
  FormResult form_result = 3;
  // 客服设置（2026-11-07，optional 保留「旧客户端未设置」语义）：
  // enable_web_search 未设置 = true（保持旧行为）；stream 未设置 = false（与旧行为一致：只推 final）
  optional bool enable_web_search = 4;
  optional bool stream = 5;
}

message StopRequest {
  string session_id = 1;
  string run_id = 2;       // Converse 流首个 SessionStart 里下发，只认当前这一轮
}
message StopReply { bool stopped = 1; }

message ListSessionsRequest { int32 limit = 1; }
message SessionInfo {
  string session_id = 1;
  string title = 2;        // 该会话第一条 user 消息（超 30 字截断），与 HTTP /sessions 同口径
  int32 count = 3;         // 消息条数
  string last_at = 4;      // 最近活跃时间（字符串表示，与库内格式一致）
}
message ListSessionsReply { repeated SessionInfo sessions = 1; }

message HistoryRequest { string session_id = 1; int32 limit = 2; }
message Image { string url = 1; string caption = 2; }
// 导购推荐的商品卡片（M11/M12）：平台渲染图片 / 价格 / 库存 / 销量 / 评分
message ProductCard {
  string product_id = 1;
  string name = 2;
  string image = 3;
  string price = 4;
  string stock = 5;
  string sales = 6;
  string rating = 7;
  string merchant_name = 8;
  string spec_text = 9;
  string category_name = 10;
}
message HistoryMessage {
  string role = 1;         // user / assistant
  string text = 2;
  repeated Image images = 3;
  string ts = 4;
  repeated Trace trace = 5; // 本轮执行流；老消息为空
  repeated ProductCard products = 6; // 导购商品卡片；老消息为空
  repeated FormRequest forms = 7;    // 历史里的表单请求（前端只读展示，不可再提交）
}
message HistoryReply { repeated HistoryMessage messages = 1; }

// ── 会话内表单（2026-11-07，评审通过；字段定义见 docs/form-protocol-review.md）──

message FormOption {
  string value = 1;
  string label = 2;
}
message FormField {
  string name = 1;             // 回传字段名，agent 侧按它取值
  string label = 2;
  string type = 3;             // text | number | select | date
  bool required = 4;
  string placeholder = 5;
  string default_value = 6;
  repeated FormOption options = 7;  // type=select 时必填
}
message FormRequest {
  string form_id = 1;          // 幂等 id（服务端生成；回传时校验）
  string form_type = 2;        // 首批只做 refund_reason
  string title = 3;
  string description = 4;
  repeated FormField fields = 5;
  string submit_label = 6;
  int32 expires_in_seconds = 7;  // 建议 600；过期后服务端拒收、前端置灰
  // agent 侧上下文（前端不渲染）：例如 {"orderNo":"2026..."}；
  // 表单回传时服务端按 form_type + 这份上下文拼出工具参数
  map<string, string> meta = 9;
}
message FormResult {
  string form_id = 1;
  map<string, string> values = 2;
}

// ── 事件（流回）──

message SessionStart {
  string session_id = 1;
  string run_id = 2;       // 客户端必须存下来（Stop 要用）
}

// 统一执行流：主 agent 的调度步骤 + subagent 图内事件（UI 渲染灰字）
// 只承载用户可读动作，不暴露工具名、调用参数或工具返回原文（2026-11-10 起）。
// kind 取值：
//   delegate —— 派发 subagent（agent 为空，detail = 中文子任务，如「为您推荐商品」）
//   tool     —— 调用工具（agent 为空，detail = 中文动作，如「查询在售商品」）
//   result   —— 工具返回（agent 为空，detail 固定「已完成」；subagent 结果以主层这一条为准）
//   reply    —— 生成回复（agent 为空，detail 形如「生成回复（N 字符）」）
//   node     —— subagent 图内节点步骤（agent = 中文子任务标签，detail = 中文节点名）
message Trace {
  string kind = 1;
  string agent = 2;        // 仅 node 事件为中文子任务标签；其余为空
  string detail = 3;       // 用户可读的中文动作，不承载工具名/参数/返回原文
}

// 流式增量。一期说明：主 agent 的回复整段生成、经 FinalEvent 下发，
// 本字段暂不推送（Java 前端一期整段渲染即可）；后续主 agent 上流式生成时启用
message Delta { string delta = 1; }

message Usage {
  int32 calls = 1;         // 累计模型调用次数（含未计价）
  int32 failed = 2;
  int64 total_tokens = 3;
  double cost = 4;         // 估算成本（元）
  int64 elapsed_ms = 5;
  int32 unpriced_calls = 6;
}

message FinalEvent {
  string answer = 1;
  repeated Image images = 2;   // 结构化配图（含图注），M5 起贯通；无图时为空
  bool web_only = 3;           // 本轮只有联网结果、知识库一条都没命中（前端挂提示横幅）
  repeated ProductCard products = 4; // 导购推荐的商品卡片；无推荐时为空
  repeated FormRequest forms = 5;    // 本轮下发的会话内表单（最多 1 张）；无表单时为空
}

message ErrorEvent { string message = 1; }

// 一条事件；Java 侧 switch 即穷尽（漏一种编译器会说）
message Event {
  oneof kind {
    SessionStart start = 1;
    Trace trace = 2;
    Delta delta = 3;
    Usage usage = 4;
    FinalEvent final = 5;
    ErrorEvent error = 6;
  }
}

service AgentService {
  // 发一条用户消息，事件流回 —— 一次调用、事件流回，流的归属天然就是这次调用
  rpc Converse (ConverseRequest) returns (stream Event);
  // 停止本轮生成（作用于 run_main_agent 的整轮，同一套 active/stop 机制）
  rpc Stop (StopRequest) returns (StopReply);
  rpc ListSessions (ListSessionsRequest) returns (ListSessionsReply);
  rpc GetHistory (HistoryRequest) returns (HistoryReply);
}
