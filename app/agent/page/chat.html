<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>买小购 · 客服问答</title>
<script>
  // 在首帧渲染前定主题，避免深色模式下的白屏闪烁（FOUC）
  (function () {
    try {
      var saved = localStorage.getItem('kb-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    } catch (e) { /* localStorage 不可用时用默认浅色 */ }
  })();
</script>
<style>
  /* ============================================================
     设计令牌
     白昼：冷调纸白 + 墨绿（verdigris）—— 取自产品说明书印刷与仪表铜绿的意象
     黑夜：深墨底 + 铜锈绿 —— 同一套语义的另一面，不是另一套配色
     ============================================================ */
  :root {
    /* 排版 */
    --font-sans: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, Consolas, monospace;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 16px;

    --ease: cubic-bezier(.2, .7, .3, 1);
  }

  html[data-theme="light"] {
    --bg:            #ECEDE9;
    --surface:       #F5F6F2;
    --surface-2:     #FFFFFE;
    --line:          #D3D7CD;
    --line-strong:   #B7BEB0;
    --ink:           #171A16;
    --ink-2:         #3E4640;
    --ink-dim:       #5F695F;
    --accent:        #1C6A5A;
    --accent-ink:    #F2F7F4;
    --accent-soft:   rgba(28, 106, 90, .09);
    --live:          #8F5A0E;
    /* 完成态 = 品牌绿：管线被品牌色逐渐填满，完成时整条管线是绿的 */
    --done:          var(--accent);
    --fail:          #B23A48;
    /* 降级态：节点跑过了，但结果是空的（依赖不可用/调用失败）—— 比 --fail 温和，
       因为整轮通常是成功的，只是有一路没取到东西 */
    --warn:          #9A6B00;
    --shadow:        0 1px 2px rgba(20,26,20,.05), 0 8px 24px -12px rgba(20,26,20,.16);
    --grid-line:     rgba(23, 26, 22, .045);
  }

  html[data-theme="dark"] {
    --bg:            #0C0F0D;
    --surface:       #141815;
    --surface-2:     #1A1F1B;
    --line:          #28302A;
    --line-strong:   #3A453C;
    --ink:           #E4E9E3;
    --ink-2:         #B3BDB4;
    --ink-dim:       #818B82;
    --accent:        #4FBF9C;
    --accent-ink:    #07130F;
    --accent-soft:   rgba(79, 191, 156, .13);
    --live:          #D9A441;
    --done:          var(--accent);
    --fail:          #E06C7A;
    --warn:          #E0B054;
    --shadow:        0 1px 2px rgba(0,0,0,.35), 0 12px 32px -16px rgba(0,0,0,.7);
    --grid-line:     rgba(228, 233, 227, .035);
  }

  /* ============================================================
     基础
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    /* 极淡的图纸网格：呼应"技术手册"的底纹，不喧宾夺主 */
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14.5px;
    line-height: 1.75;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: var(--font-mono); font-variant-ligatures: none; }

  /* 中文疏排字距：用于眉标，是中文排版的古典手法 */
  .eyebrow {
    font-size: 10.5px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--ink-dim); font-family: var(--font-mono);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }

  /* ============================================================
     顶栏
     ============================================================ */
  .topbar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 13px 22px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark {
    width: 27px; height: 27px; border-radius: 7px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 13px;
    flex-shrink: 0;
  }
  .brand .name { font-weight: 600; font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
  .brand .sub { font-size: 11px; color: var(--ink-dim); margin-top: -3px; }
  .topbar .spacer { flex: 1; }

  .ctl-group { display: flex; align-items: center; gap: 9px; }

  /* 流式开关 */
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    width: 34px; height: 19px; border-radius: 10px;
    background: var(--line-strong); position: relative;
    transition: background .22s var(--ease);
    flex-shrink: 0;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 2.5px; left: 2.5px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface-2);
    transition: transform .22s var(--ease);
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(15px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch .label { font-size: 12px; color: var(--ink-2); }

  /* 主题切换 */
  .theme-btn {
    width: 32px; height: 32px; flex-shrink: 0;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--ink-2);
    display: grid; place-items: center; cursor: pointer;
    transition: color .18s, border-color .18s, background .18s;
  }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); }
  .theme-btn svg { width: 15px; height: 15px; }
  html[data-theme="light"] .theme-btn .i-sun { display: none; }
  html[data-theme="dark"]  .theme-btn .i-moon { display: none; }

  /* 连接状态 */
  .conn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-family: var(--font-mono);
    padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--line);
    color: var(--ink-dim); background: var(--surface-2);
    white-space: nowrap;
  }
  .conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); flex-shrink: 0; }
  .conn.on  { border-color: color-mix(in srgb, var(--done) 40%, transparent); color: var(--done); }
  .conn.on .dot { background: var(--done); }
  .conn.busy { border-color: color-mix(in srgb, var(--live) 45%, transparent); color: var(--live); }
  .conn.busy .dot { background: var(--live); animation: pulse 1.1s ease-in-out infinite; }
  .conn.err { border-color: color-mix(in srgb, var(--fail) 45%, transparent); color: var(--fail); }
  .conn.err .dot { background: var(--fail); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  /* ============================================================
     对话区
     ============================================================ */
  #chat { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .column { max-width: 860px; margin: 0 auto; padding: 30px 22px 20px; }

  /* ============================================================
     左侧会话栏
     布局：body(纵向) > .workspace(横向) > [.sidebar | .chat-area(纵向)]
     .chat-area 里装 #chat + 确认卡片 + 输入框，所以它们不会被侧栏压到左边
     ============================================================ */
  .workspace { flex: 1; display: flex; min-height: 0; }
  .chat-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .sidebar {
    width: 248px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 55%, transparent);
  }
  .sidebar-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 12px 10px 18px;
  }
  .sidebar-label {
    font-size: 11.5px; letter-spacing: .1em; color: var(--ink-dim);
    text-transform: uppercase; font-weight: 600;
  }
  .new-chat {
    margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
    transition: border-color .18s, color .18s;
  }
  .new-chat:hover { border-color: var(--accent); color: var(--accent); }
  .new-chat svg { width: 14px; height: 14px; }

  .session-list { flex: 1; overflow-y: auto; padding: 0 10px 14px; }
  .session-empty { padding: 12px 10px; font-size: 12.5px; color: var(--ink-dim); }
  .session-item {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 8px 8px 11px; border-radius: 9px; cursor: pointer;
    color: var(--ink-2); transition: background .16s, color .16s;
  }
  .session-item:hover { background: var(--surface-2); }
  .session-item.active { background: var(--accent-soft); color: var(--ink); }
  .session-main { min-width: 0; flex: 1; }
  .session-title {
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session-item.active .session-title { font-weight: 600; }
  .session-meta { font-size: 11.5px; color: var(--ink-dim); }
  .session-del {
    flex-shrink: 0; width: 22px; height: 22px; padding: 0; border: none; border-radius: 6px;
    display: none; align-items: center; justify-content: center; cursor: pointer;
    background: none; color: var(--ink-dim);
  }
  .session-item:hover .session-del { display: inline-flex; }
  .session-del:hover { color: var(--fail); background: var(--surface); }
  .session-del svg { width: 13px; height: 13px; }

  /* 空状态：不写"暂无数据"，而是引导提问 */
  .empty-state { padding: 58px 0 40px; text-align: center; }
  .empty-state .eyebrow { margin-bottom: 14px; }
  .empty-state h2 {
    font-size: 23px; font-weight: 600; margin: 0 0 10px; letter-spacing: -.01em;
  }
  .empty-state p { color: var(--ink-dim); margin: 0 auto 26px; max-width: 430px; font-size: 13.5px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  .suggestion {
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--ink-2); border-radius: 20px; padding: 7px 15px;
    font-size: 12.5px; cursor: pointer; font-family: inherit;
    transition: border-color .18s, color .18s, transform .18s var(--ease);
  }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  .msg { margin-bottom: 26px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 78%; background: var(--accent); color: var(--accent-ink);
    padding: 11px 16px; border-radius: var(--r-lg) var(--r-lg) 4px var(--r-lg);
    white-space: pre-wrap; word-break: break-word;
    box-shadow: var(--shadow);
  }

  /* 回答卡片 */
  .answer-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden;
  }
  .answer-body { padding: 20px 22px; }

  /* 纯联网作答的横幅：答案不是来自知识库，要一眼看得出来。
     放在卡片最顶部 —— 阅读答案之前先看到它 */
  .answer-warn {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 22px;
    background: color-mix(in srgb, var(--warn) 12%, transparent);
    border-bottom: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
    color: var(--warn); font-size: 12.5px; font-weight: 600;
  }
  /* 必须显式写：上面的 display:flex 权重高于通用 [hidden] */
  .answer-warn[hidden] { display: none; }
  .answer-warn svg { width: 15px; height: 15px; flex-shrink: 0; }
  /* 答案正文由 renderMarkdown 渲染成块级元素，所以这里用常规空白处理（不再是 pre-wrap） */
  .answer-body .txt { word-break: break-word; line-height: 1.78; }
  .answer-body .txt > :first-child { margin-top: 0; }
  .answer-body .txt > :last-child { margin-bottom: 0; }
  .answer-body .txt p { margin: 0 0 14px; }

  /* 被用户暂停：半截答案保留在屏上，但压暗并打上标记 ——
     它是**作废**的内容，不能让人误以为这就是完整回答 */
  .answer-body.paused .txt { opacity: .45; }
  .paused-badge {
    display: inline-block; margin-bottom: 10px; padding: 2px 10px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface-2); color: var(--ink-dim);
    font-size: 11.5px; letter-spacing: .02em;
  }

  /* 标题：层级分明但不喧宾夺主 */
  .answer-body .txt h1, .answer-body .txt h2, .answer-body .txt h3,
  .answer-body .txt h4, .answer-body .txt h5, .answer-body .txt h6 {
    margin: 24px 0 10px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em;
  }
  .answer-body .txt h1 { font-size: 19px; }
  .answer-body .txt h2 { font-size: 17px; }
  .answer-body .txt h3 { font-size: 15.5px; }
  .answer-body .txt h4, .answer-body .txt h5, .answer-body .txt h6 { font-size: 14.5px; color: var(--ink-2); }

  /* 列表：序号用强调色，看起来更像一篇排版过的文档 */
  .answer-body .txt ol, .answer-body .txt ul { margin: 0 0 14px; padding-left: 24px; }
  .answer-body .txt li { margin: 6px 0; padding-left: 2px; }
  .answer-body .txt li::marker { color: var(--accent); }
  .answer-body .txt li > ul, .answer-body .txt li > ol { margin: 6px 0 0; }

  .answer-body .txt strong { font-weight: 600; }
  .answer-body .txt em { font-style: italic; color: var(--ink-2); }

  .answer-body .txt code {
    font-family: var(--font-mono); font-size: .88em; padding: 1px 5px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px;
  }
  .answer-body .txt pre {
    margin: 0 0 14px; padding: 12px 14px; overflow-x: auto;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm);
  }
  .answer-body .txt pre code {
    padding: 0; border: none; background: none; font-size: 12.5px; line-height: 1.6;
  }

  .answer-body .txt a {
    color: var(--accent); text-decoration: none;
    border-bottom: 1px solid var(--accent-soft);
  }
  .answer-body .txt a:hover { border-bottom-color: var(--accent); }

  .answer-body .txt blockquote {
    margin: 0 0 14px; padding: 10px 16px; color: var(--ink-2);
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
  }
  .answer-body .txt hr { margin: 22px 0; border: none; border-top: 1px solid var(--line); }

  /* 答案配图：做成带标号与图注的图卡，并用一条分隔线把它和正文分开，
     避免几张裸图突然堆在末尾显得突兀 */
  .answer-figs { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .answer-figs:empty { display: none; }
  .figs-head {
    margin-bottom: 12px; font-size: 11.5px; letter-spacing: .08em;
    color: var(--ink-dim); font-family: var(--font-mono);
  }
  .figs-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .fig {
    margin: 0; overflow: hidden; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--r-md);
  }
  .fig img { width: 100%; display: block; cursor: zoom-in; background: var(--bg); }
  .fig figcaption {
    padding: 9px 12px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
    border-top: 1px solid var(--line);
  }
  /* 切片标题常自带章节号（如「3.4.1 装入全幅烫金膜盒」），
     与「图 N」编号挨太近会被读成一个数字，所以上面把间距留大到 9px */
  .fig-no {
    display: inline-block; margin-right: 9px; padding: 1px 7px;
    font-family: var(--font-mono); font-size: 11px; border-radius: 999px;
    color: var(--accent); background: var(--accent-soft);
  }

  /* ============================================================
     本次消耗
     挂在答案卡片底部，随每个模型调用结束实时跳动（用法同桌面端的状态条）
     ============================================================ */
  .usage-bar {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    padding: 10px 22px; border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface-2) 55%, var(--surface));
    font-size: 11.5px; color: var(--ink-dim);
  }
  .usage-bar[hidden] { display: none; }
  .usage-bar .dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--live); animation: pulse 1.4s ease-in-out infinite;
  }
  .usage-bar.done .dot { background: var(--done); animation: none; }
  .usage-bar .label { letter-spacing: .06em; }
  .usage-bar .stat { font-family: var(--font-mono); color: var(--ink-2); white-space: nowrap; }
  .usage-bar .stat b { font-weight: 600; color: var(--ink); }
  .usage-bar .sep { color: var(--line-strong); }
  /* 数值跳动时闪一下强调色，让「又花了一笔」看得见 */
  @keyframes tick { from { color: var(--accent) } to { color: var(--ink) } }
  .usage-bar .bump { animation: tick .85s ease-out; }
  .usage-bar .expand {
    margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
    padding: 0; border: none; background: none; cursor: pointer;
    font: inherit; color: var(--ink-dim); user-select: none;
  }
  .usage-bar .expand:hover { color: var(--ink-2); }
  .usage-bar .expand svg { width: 9px; height: 9px; transition: transform .25s var(--ease); }
  .usage-bar.open .expand svg { transform: rotate(90deg); }
  .usage-detail { display: none; width: 100%; margin-top: 8px; }
  .usage-bar.open .usage-detail { display: block; }
  .usage-row {
    display: grid; grid-template-columns: 1fr auto auto auto;
    gap: 14px; align-items: baseline;
    padding: 4px 0; font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-2); border-top: 1px dashed var(--line);
  }
  .usage-row:first-child { border-top: none; }
  .usage-row.head { color: var(--ink-dim); font-size: 10px; letter-spacing: .08em; }
  .usage-row .who { font-family: var(--font-sans); color: var(--ink-2); }
  .usage-row.head .who { color: var(--ink-dim); }
  .usage-row .num { text-align: right; }
  .usage-row .cost { color: var(--ink); }
  .usage-bar .fail { color: var(--fail); }
  .usage-bar .note { color: var(--ink-dim); }

  /* 访问密钥登录层：任何接口返回 401 时弹出 */
  .login-mask {
    position: fixed; inset: 0; z-index: 60; display: flex;
    align-items: center; justify-content: center; padding: 20px;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(3px);
  }
  .login-mask[hidden] { display: none; }
  .login-box {
    width: 100%; max-width: 340px; padding: 24px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); box-shadow: var(--shadow);
  }
  .login-box h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .login-box p { margin: 0 0 16px; font-size: 12.5px; color: var(--ink-dim); }
  .login-box input {
    width: 100%; margin-bottom: 12px; padding: 8px 10px; font-size: 13px;
    color: var(--ink); background: var(--surface-2); font-family: var(--font-mono);
    border: 1px solid var(--line); border-radius: var(--r-sm);
  }
  .login-box input:focus { outline: none; border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 8px; cursor: pointer; font-size: 13px;
    color: var(--accent-ink); background: var(--accent);
    border: 1px solid var(--accent); border-radius: var(--r-sm);
    transition: opacity .18s;
  }
  .login-btn:hover:not(:disabled) { opacity: .88; }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; }
  .login-err { margin-top: 10px; font-size: 12.5px; color: var(--fail); min-height: 17px; }

  /* ============================================================
     执行流：灰色小字
     主 agent 的调度步骤（派发 / 工具 / 返回）与 subagent 图内节点，
     统一渲染成同一种细灰行（M5 起替代泳道；数据源见 main_agent 的事件流）。
     运行中默认展开、最后一行行首呼吸；收尾（final / 暂停 / 出错）自动收起
     ============================================================ */
  .trace {
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface-2) 60%, var(--surface));
  }
  .trace[hidden] { display: none; }
  .trace-head {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 18px; cursor: pointer; user-select: none;
    transition: background .18s;
  }
  .trace-head:hover { background: var(--accent-soft); }
  .trace-head .chev {
    width: 11px; height: 11px; flex-shrink: 0; color: var(--ink-dim);
    transition: transform .25s var(--ease);
  }
  .trace.open .trace-head .chev { transform: rotate(90deg); }
  .trace-head .title { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .trace.running .trace-head .title { color: var(--live); }
  .trace-head .count { font-size: 11.5px; color: var(--ink-dim); margin-left: auto; }
  .trace-head .count .mono { color: var(--ink-2); }
  /* 执行中的呼吸点：答案要整段才到，中途只有这些灰字在动 */
  .trace .livedot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--live); display: none;
  }
  .trace.running .livedot { display: inline-block; animation: pulse 1.1s ease-in-out infinite; }

  .trace-body { max-height: 0; overflow: hidden; transition: max-height .34s var(--ease); }
  .trace.open .trace-body { max-height: 300px; overflow-y: auto; }
  .trace-lines { padding: 2px 18px 12px 30px; }

  .trace-line {
    font-size: 12px; line-height: 1.95; color: var(--ink-dim);
    /* 一条事件一行：长内容截断，悬停看全文（title） */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .trace-line .tk { color: var(--line-strong); margin-right: 7px; }
  /* 轮次开始时占位的一行「正在处理…」：首条真实事件到达即被替换 */
  .trace-line.placeholder { opacity: .72; }
  /* 子图节点（kind=node）：缩进 + 左侧竖轨，表示「在某个 subagent 内部」 */
  .trace-line.sub { padding-left: 13px; border-left: 2px solid var(--line); margin-left: 2px; }
  /* 正在跑：最后一行行首呼吸 */
  .trace.running .trace-line:last-child .tk { color: var(--accent); animation: pulse 1.1s ease-in-out infinite; }

  /* ============================================================
     输入区
     ============================================================ */
  .composer {
    flex-shrink: 0; border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(10px);
    padding: 14px 22px 17px;
  }
  .composer .inner { max-width: 860px; margin: 0 auto; }
  .field {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 13px; padding: 7px 7px 7px 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #input {
    flex: 1; resize: none; border: none; background: none; outline: none;
    color: var(--ink); font-family: inherit; font-size: 14.5px; line-height: 1.65;
    min-height: 26px; max-height: 148px; padding: 5px 0;
  }
  #input::placeholder { color: var(--ink-dim); }
  #send {
    flex-shrink: 0; height: 34px; padding: 0 17px;
    border: none; border-radius: 9px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px;
    transition: opacity .18s, transform .18s var(--ease);
  }
  #send:hover:not(:disabled) { transform: translateY(-1px); }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  #send .ico { width: 13px; height: 13px; }

  /* 暂停按钮：只在流式生成期间出现（非流式是同步一次调用，无处可断） */
  #pause {
    flex-shrink: 0; height: 34px; padding: 0 14px;
    border: 1px solid var(--line-strong); border-radius: 9px; cursor: pointer;
    background: transparent; color: var(--ink-dim);
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color .18s, border-color .18s, opacity .18s;
  }
  /* 必须显式写：上面的 display:inline-flex 权重高于通用 [hidden]，不写就藏不住 */
  #pause[hidden] { display: none; }
  #pause:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-dim); }
  #pause:disabled { opacity: .45; cursor: default; }
  #pause .ico { width: 10px; height: 10px; }

  .composer .foot {
    display: flex; align-items: center; gap: 10px;
    margin-top: 9px; padding: 0 2px;
    font-size: 11.5px; color: var(--ink-dim);
  }
  .composer .foot .kbd {
    font-family: var(--font-mono); font-size: 10.5px;
    border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; color: var(--ink-dim);
  }
  .composer .foot .spacer { flex: 1; }

  /* 滚动条 */
  #chat::-webkit-scrollbar { width: 9px; }
  #chat::-webkit-scrollbar-thumb {
    background: var(--line-strong); border-radius: 5px;
    border: 2px solid var(--bg);
  }
  #chat::-webkit-scrollbar-thumb:hover { background: var(--ink-dim); }
  #chat::-webkit-scrollbar-track { background: transparent; }

  /* 窄屏抽屉的两个零件在宽屏下不出现 */
  .drawer-btn { display: none; }
  .drawer-mask { display: none; }

  @media (max-width: 620px) {
    .column, .composer .inner { padding-left: 14px; padding-right: 14px; }
    .topbar { padding: 11px 14px; gap: 10px; }
    .brand .sub { display: none; }
    /* 窄屏的会话栏是**抽屉**：原来这里是 `display:none`，优先保阅读宽度的代价是
       手机上没法切换/新建会话（老问题）。现在改成从左侧滑出、点遮罩或选中会话即收起 */
    .drawer-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; flex-shrink: 0;
      border: 1px solid var(--line); border-radius: 9px;
      background: var(--surface); color: var(--ink);
    }
    .drawer-btn svg { width: 17px; height: 17px; }
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 60;
      width: 82%; max-width: 320px;
      /* 抽屉里要实底：原来那个半透明背景会透出下面的正文 */
      background: var(--surface);
      box-shadow: 0 0 24px rgba(0, 0, 0, .18);
      transform: translateX(-100%);
      transition: transform .22s var(--ease);
    }
    .sidebar.open { transform: translateX(0); }
    .drawer-mask {
      display: block; position: fixed; inset: 0; z-index: 55;
      background: rgba(0, 0, 0, .35);
      opacity: 0; pointer-events: none; transition: opacity .22s var(--ease);
    }
    .drawer-mask.open { opacity: 1; pointer-events: auto; }
    .switch .label { display: none; }
  }

  /* 手机上顶栏本就紧（汉堡 + 品牌 + 两个开关 + 主题 + 连接态），再挤下去品牌名会折成竖排 ——
     到这一档就只留那个「掌」字标，名称让位给控件 */
  @media (max-width: 430px) {
    .brand .name { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    #chat { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="drawer-btn" id="drawerBtn" title="会话列表" aria-label="会话列表" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand">
    <div class="mark">买</div>
    <div>
      <div class="name">买小购</div>
      <div class="sub">一次买够 · 客服智能体</div>
    </div>
  </div>
  <span class="spacer"></span>
  <div class="ctl-group">
    <label class="switch" title="开启后答案逐字输出，并实时显示检索进度">
      <input type="checkbox" id="streamToggle" checked>
      <span class="track"></span>
      <span class="label">流式</span>
    </label>
    <label class="switch" title="关掉后本轮只从知识库与图谱取参考内容，不调用联网搜索">
      <input type="checkbox" id="webToggle" checked>
      <span class="track"></span>
      <span class="label">联网</span>
    </label>
    <button class="theme-btn" id="themeBtn" title="切换昼夜模式" aria-label="切换昼夜模式">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">连接中</span></span>
  </div>
</header>

<div class="workspace">
  <div class="drawer-mask" id="drawerMask"></div>
  <!-- 左侧会话栏：切换 / 新建 / 删除会话（窄屏下是抽屉，见 .drawer-btn） -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-label">会话</span>
      <button class="new-chat" id="newChat" title="新建会话" aria-label="新建会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <div class="chat-area">
    <main id="chat"><div class="column" id="column"></div></main>

<!-- 访问密钥登录层：接口返回 401 时弹出 -->
<div class="login-mask" id="loginMask" hidden>
  <div class="login-box">
    <h2>需要访问密钥</h2>
    <p>请输入分配给你的访问密钥</p>
    <input id="loginKey" type="password" placeholder="访问密钥" autocomplete="current-password">
    <button class="login-btn" id="loginBtn">进入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<footer class="composer">
  <div class="inner">
    <div class="field">
      <textarea id="input" rows="1" placeholder="描述你的问题，例如：烫金膜盒怎么安装？"></textarea>
      <button id="pause" type="button" title="暂停生成" aria-label="暂停生成" hidden>
        <svg class="ico" viewBox="0 0 12 12" fill="none">
          <circle cx="6" cy="6" r="5.1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="3.9" y="3.9" width="4.2" height="4.2" rx="0.7" fill="currentColor"/>
        </svg>
        <span>暂停</span>
      </button>
      <button id="send">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        <span>发送</span>
      </button>
    </div>
    <div class="foot">
      <span class="kbd">Enter</span><span>发送</span>
      <span class="kbd">Shift + Enter</span><span>换行</span>
      <span class="spacer"></span>
      <span id="hint">就绪</span>
    </div>
  </div>
</footer>
  </div><!-- /.chat-area -->
</div><!-- /.workspace -->

<script>
'use strict';

/* ============================================================
   状态
   ============================================================ */
/* 会话 id 持久化：**刷新后要接着聊同一个会话**，所以不能每次加载都重新随机。
   风格照主题那套（见 <head> 里读 kb-theme 的写法）：读失败就退回随机生成。 */
const SESSION_KEY = 'kb-session-id';
function newSessionId() {
  return 'sess_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function rememberSession(id) {
  try { localStorage.setItem(SESSION_KEY, id); } catch (e) {}
}
let sessionId = (() => {
  try {
    const saved = localStorage.getItem(SESSION_KEY);
    if (saved) return saved;
  } catch (e) {}
  const id = newSessionId();
  rememberSession(id);
  return id;
})();
let eventSource = null;
let busy = false;
// 本轮标识（POST /query 下发）：点暂停时要原样带回后端。
// 它是「暂停令牌」——后端只认当前在跑的那一轮，从而挡掉迟到的暂停信号误杀下一轮
let runId = null;

const $ = (id) => document.getElementById(id);

/* ============================================================
   访问鉴权：包一层 fetch，任何请求返回 401 就弹登录框
   —— 页面上的调用点一处都不用改
   ============================================================ */
const _origFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const res = await _origFetch(...args);
  if (res.status === 401) showLogin();
  return res;
};

function showLogin() {
  const m = $('loginMask');
  if (m.hidden) { m.hidden = false; $('loginKey').focus(); }
}

async function doLogin() {
  const key = $('loginKey').value.trim();
  const err = $('loginErr');
  if (!key) { err.textContent = '请输入访问密钥'; return; }

  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '校验中…';
  err.textContent = '';
  try {
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key }),
    });
    if (!r.ok) { err.textContent = '密钥无效或已撤销'; return; }
    // 服务端已种下 Cookie，重新加载即可带着身份跑
    location.reload();
  } catch (e) {
    err.textContent = '无法连接服务';
  } finally {
    btn.disabled = false; btn.textContent = '进入';
  }
}

$('loginBtn').onclick = doLogin;
$('loginKey').onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
const column = $('column');

/* ============================================================
   执行流（灰色小字）的渲染规则
   服务端 `trace` 事件：{kind, agent, detail}，kind ∈
   delegate（派发 subagent）/ tool（调用工具）/ result（工具返回）/
   reply（生成回复）/ node（subagent 图内节点，detail = 中文节点名）。
   与 CLI 的 `_render_event`、gRPC 的 `Trace` 消费同一份事件（M5 起泳道退役）。
   ============================================================ */
const AGENT_CN = { 'product-kb': '产品知识库', 'product-guide': '商品导购', 'order-service': '订单服务' };
const agentCN = (name) => AGENT_CN[name] || name || '';

function traceText(d) {
  switch (d.kind) {
    case 'delegate': return `派发 → ${agentCN(d.agent)}：${d.detail || ''}`;
    case 'tool':     return `调用工具 ${d.agent || ''}：${d.detail || ''}`;
    case 'result':   return `工具返回：${d.detail || ''}`;
    default:         return d.detail || '';    // reply / node：detail 即全文
  }
}

/* 执行流块的 HTML 与接线（实时轮次与历史卡片共用同一套；历史里填好行、静态收起） */
const TRACE_HTML = `
      <div class="trace" hidden>
        <div class="trace-head" role="button" tabindex="0" aria-expanded="false">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          <span class="livedot"></span>
          <span class="title">执行中…</span>
          <span class="count"><span class="mono">0</span> 步</span>
        </div>
        <div class="trace-body"><div class="trace-lines"></div></div>
      </div>`;

function wireTrace(el) {
  const root = el.querySelector('.trace');
  const head = root.querySelector('.trace-head');
  const toggle = () => {
    const open = root.classList.toggle('open');
    head.setAttribute('aria-expanded', String(open));
  };
  head.onclick = toggle;
  head.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  };
  return {
    root, head,
    body: root.querySelector('.trace-body'),
    lines: root.querySelector('.trace-lines'),
    title: head.querySelector('.title'),
    count: head.querySelector('.count .mono'),
    n: 0,
    placeholder: null,   // 轮次开始时的「正在处理…」占位行（首条事件到达即移除）
  };
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ============================================================
   极简 Markdown 渲染
   覆盖：标题、代码块、粗体/斜体/行内代码、链接、有序/无序列表（含一层嵌套）、
   引用块、分隔线、段落。
   **先整体 esc 再解析**——答案里可能夹着文档正文，不转义就等于把切片内容当标签执行。
   注意 esc 之后 ">" 已变成 "&gt;"，所以引用块要用转义后的写法判断。
   ============================================================ */
function inlineMd(s) {
  // 先把行内代码抽出来占位，否则里面的 * 会被后面当成粗体解析
  const codes = [];
  let t = s.replace(/`([^`]+)`/g, (m, c) => {
    codes.push(c);
    return '\u0000' + (codes.length - 1) + '\u0000';
  });
  t = t
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    // 粗体已经先被吃掉，剩下的 *…* 当斜体；不加左边界断言，
    // 否则 "中文标点*斜体*" 这种写法（前面不是空格）会漏掉
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    // 只放行 http(s) 与本域路径，挡掉 javascript: 之类的伪协议
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) =>
      /^(https?:\/\/|\/)/i.test(url)
        ? `<a href="${url}" target="_blank" rel="noopener">${text}</a>`
        : m);
  return t.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[+i] + '</code>');
}

function renderMarkdown(md) {
  const out = [];
  let list = null;    // { tag: 'ol'|'ul', items: [{text, subs: []}] }
  let para = [];
  let fence = null;   // 代码围栏内的行，围栏里一律不做 Markdown 解析

  const flushPara = () => {
    if (para.length) { out.push('<p>' + inlineMd(para.join('<br>')) + '</p>'); para = []; }
  };
  const flushList = () => {
    if (!list) return;
    const body = list.items.map(it =>
      '<li>' + inlineMd(it.text) +
      (it.subs.length
        ? '<ul>' + it.subs.map(s => '<li>' + inlineMd(s) + '</li>').join('') + '</ul>'
        : '') +
      '</li>').join('');
    out.push('<' + list.tag + '>' + body + '</' + list.tag + '>');
    list = null;
  };
  const pushItem = (tag, text) => {
    if (list && list.tag !== tag) {
      // 有序列表后紧跟的无序项按「嵌套」处理（模型就是这样表达子步骤的）
      if (tag === 'ul' && list.tag === 'ol' && list.items.length) {
        list.items[list.items.length - 1].subs.push(text);
        return;
      }
      flushList();
    }
    if (!list) list = { tag, items: [] };
    list.items.push({ text, subs: [] });
  };

  for (const raw of esc(md || '').split('\n')) {
    const line = raw.replace(/\s+$/, '');   // 行尾双空格是 Markdown 的硬换行标记，去掉
    const t = line.trim();

    if (t.startsWith('```')) {              // 围栏开合
      if (fence === null) { flushPara(); flushList(); fence = []; }
      else { out.push('<pre><code>' + fence.join('\n') + '</code></pre>'); fence = null; }
      continue;
    }
    if (fence !== null) { fence.push(line); continue; }

    if (!t) { flushPara(); flushList(); continue; }

    const h  = t.match(/^(#{1,6})\s+(.+)$/);
    const hr = /^(-{3,}|\*{3,}|_{3,})$/.test(t);
    const ol = t.match(/^\d+\.\s+(.+)$/);
    const ul = t.match(/^[-*]\s+(.+)$/);
    const bq = t.match(/^&gt;\s?(.*)$/);

    if (h) {
      flushPara(); flushList();
      const lv = h[1].length;
      out.push('<h' + lv + '>' + inlineMd(h[2]) + '</h' + lv + '>');
    } else if (hr) {
      flushPara(); flushList(); out.push('<hr>');
    } else if (ol || ul) {
      flushPara();
      pushItem(ol ? 'ol' : 'ul', (ol ? ol[1] : ul[1]).trim());
    } else if (bq) {
      flushPara(); flushList();
      out.push('<blockquote>' + inlineMd(bq[1].trim()) + '</blockquote>');
    } else {
      flushList();
      para.push(t);
    }
  }
  flushPara(); flushList();
  if (fence !== null && fence.length) {     // 流式中途被截断的围栏，也要收尾
    out.push('<pre><code>' + fence.join('\n') + '</code></pre>');
  }
  return out.join('');
}

/* 把文本渲染进答案区（答案整段到达：主 agent 协议一期不发 delta，见 proto 的 Delta 注释） */
function paintAnswer(ctx, text) {
  ctx.txt.innerHTML = renderMarkdown(text);
}

/* ============================================================

$('themeBtn').onclick = () => {

/* ============================================================
   空状态

const SUGGESTIONS = [
  '烫金膜盒怎么安装？',
  '打印质量不清晰怎么办？',
  '这款设备支持哪些纸张？',

];

function renderEmpty() {
  column.innerHTML = `
    <div class="empty-state">
      <div class="eyebrow">Knowledge Base</div>
      <h2>问点什么吧</h2>
      <p>已收录产品使用文档。提问后可以看到检索路径：哪些资料被命中、如何重排、答案从何而来。</p>
      <div class="suggestions">
        ${SUGGESTIONS.map(s => `<button class="suggestion">${esc(s)}</button>`).join('')}
      </div>
    </div>`;
  column.querySelectorAll('.suggestion').forEach(b => {
    b.onclick = () => { $('input').value = b.textContent; send(); };
  });
}
/* 首帧不再无条件渲染空状态 —— 交给下面的 boot()：有历史就显示历史，
   空会话才显示空状态。否则会先闪一下空状态再被历史顶掉 */

/* ============================================================
   历史会话：列表 / 切换 / 新建 / 删除
   ============================================================ */

/* 历史里的助手消息：还原正文、配图**与执行过程**（M5.1）—— 执行流块与实时轮次
   同款，填好行后置成静态收起态（「执行流 · N 步」，点开可回看）；
   **消耗条仍不还原**：/history 没有逐条用量数据（账目在账本 / 运行记录里）。
   刻意用 class 而不是 id：一页里会有 N 条历史卡片，重复 id 会让全局 $() 取到第一个 */
function addHistoryAnswer(text, images, trace) {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = `<div class="answer-card">
      ${TRACE_HTML}
      <div class="answer-body"><div class="txt"></div></div>
      <div class="answer-figs"></div>
    </div>`;
  column.appendChild(el);
  const ctx = { el, txt: el.querySelector('.txt'), figs: el.querySelector('.answer-figs'),
                trace: wireTrace(el) };
  if (trace && trace.length) {
    const t = ctx.trace;
    t.root.hidden = false;                 // 有过程记录 → 显示（静态 + 收起，不呼吸）
    trace.forEach(d => appendTraceLine(t, d));
    t.title.textContent = '执行流';
    t.head.setAttribute('aria-expanded', 'false');
  }
  paintAnswer(ctx, text);
  renderImages(ctx, images || []);
  return ctx;
}

/* 把 /history 返回的消息按顺序铺回对话区。
   助手侧一律当**纯文本**渲染：澄清问句、拒识、审核拒答也是以 assistant 身份存档的，
   它们没有执行流/消耗条，不能套「检索完成」那套收尾逻辑 */
function renderHistory(items) {
  column.innerHTML = '';
  items.forEach(m => {
    if (m.role === 'user') addUser(m.text || '');
    else addHistoryAnswer(m.text || '', m.images || [], m.trace || []);
  });
}

async function loadHistory(sid) {
  const prevBusy = busy;
  busy = true;                       // 加载期间先不接受发送
  try {
    const r = await fetch(`/history/${encodeURIComponent(sid)}?limit=50`);
    if (!r.ok) { renderEmpty(); return; }
    const d = await r.json();
    const items = d.items || [];
    if (items.length) { renderHistory(items); scrollDown(); }
    else renderEmpty();              // 新会话没有历史，属正常
  } catch (e) {
    renderEmpty();                   // 拉不到就当空会话，别挡着用户提问
  } finally {
    busy = prevBusy;
  }
}

function relTime(iso) {
  if (!iso) return '';
  const t = Date.parse(iso);
  if (isNaN(t)) return '';
  const s = (Date.now() - t) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
  return new Date(t).toLocaleDateString();
}

function renderSessionList(items) {
  const host = $('sessionList');
  if (!items.length) {
    host.innerHTML = '<div class="session-empty">还没有会话</div>';
    return;
  }
  host.innerHTML = items.map(s => `
    <div class="session-item${s.session_id === sessionId ? ' active' : ''}"
         data-sid="${esc(s.session_id)}" role="button" tabindex="0">
      <div class="session-main">
        <div class="session-title">${esc(s.title || s.session_id)}</div>
        <div class="session-meta">${s.count} 条 · ${esc(relTime(s.last_at))}</div>
      </div>
      <button class="session-del" data-del="${esc(s.session_id)}"
              title="删除会话" aria-label="删除会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      </button>
    </div>`).join('');

  host.querySelectorAll('.session-item').forEach(el => {
    // 先收抽屉再切：切到「当前会话」时 switchSession 会早退，但抽屉仍该收起来
    const go = () => { setDrawer(false); switchSession(el.dataset.sid); };
    el.onclick = go;
    el.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
    };
  });
  host.querySelectorAll('.session-del').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); deleteSession(btn.dataset.del); };
  });
}

async function loadSessions() {
  try {
    const r = await fetch('/sessions?limit=50');
    if (!r.ok) return;               // 顺手也把 401（登录层）交给 fetch 包装器处理
    const d = await r.json();
    renderSessionList(d.items || []);
  } catch (e) { /* 列表拉不到不影响问答本身 */ }
}

/* 切到另一个会话。**必须把上一轮的残留清干净**：runId 是上一轮的暂停令牌，
   留着会串到新会话去 */
function switchSession(sid) {
  if (busy || sid === sessionId) return;
  if (eventSource) { eventSource.close(); eventSource = null; }
  sessionId = sid;
  rememberSession(sid);
  runId = null;
  column.innerHTML = '';
  loadHistory(sid);
  loadSessions();                    // 让高亮跟上来
}

function newSession() {
  setDrawer(false);          // 抽屉里点「新建」也要收起来（busy 被拒时同样收 —— 那纯粹是 UI 动作）
  if (busy) return;
  if (eventSource) { eventSource.close(); eventSource = null; }
  sessionId = newSessionId();
  rememberSession(sessionId);
  runId = null;
  column.innerHTML = '';
  renderEmpty();
  loadSessions();
  $('input').focus();
}

async function deleteSession(sid) {
  try {
    const r = await fetch(`/history/${encodeURIComponent(sid)}`, { method: 'DELETE' });
    if (!r.ok) return;
  } catch (e) { return; }
  if (sid === sessionId) newSession();   // 删的正是当前会话 → 顺势开一个新的
  else loadSessions();
}

$('newChat').onclick = newSession;

/* ---------- 窄屏抽屉：会话栏 ----------
   原来 ≤620px 时会话栏是 `display:none`（优先保阅读宽度），代价是手机上没法切换会话。
   现在从左侧滑出：点汉堡开、点遮罩/按 Esc/选中会话即收。宽屏下这些元素都不显示，
   `open` 类也无效（相关样式都在媒体查询里）—— 所以宽屏完全不受影响 */
function setDrawer(open) {
  const bar = $('sidebar'), mask = $('drawerMask'), btn = $('drawerBtn');
  if (!bar || !mask) return;
  bar.classList.toggle('open', open);
  mask.classList.toggle('open', open);
  if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
$('drawerBtn').onclick = () => setDrawer(!$('sidebar').classList.contains('open'));
$('drawerMask').onclick = () => setDrawer(false);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setDrawer(false); });
// 转回宽屏时把状态收掉：否则遮罩会留在页面上（它在宽屏下本来不显示，但类名残留会误导调试）
window.addEventListener('resize', () => { if (window.innerWidth > 620) setDrawer(false); });

/* 启动：会话列表 → 当前会话历史（无状态化后不再有「挂起轮」要恢复，M4-T3 退役） */
(async function boot() {
  await loadSessions();
  await loadHistory(sessionId);
})();

/* ============================================================
   创建一轮对话的 DOM
   ============================================================ */
function addUser(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  column.appendChild(el);
  scrollDown();
}

function addAnswer() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = `
    <div class="answer-card">
      <!-- 纯联网作答的提示：答案不是来自知识库。默认收起，
           收到 final（流式）或响应体（非流式）里的 web_only 才显示 -->
      <div class="answer-warn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <span>内容来自网络，仅供参考</span>
      </div>
      <!-- 执行流：发送即由 beginTrace 亮出；护栏拒答这类零步骤轮不出现 -->
      ${TRACE_HTML}
      <div class="answer-body"><div class="txt"></div></div>
      <div class="answer-figs"></div>
      <div class="usage-bar" hidden>
        <span class="dot"></span>
        <span class="label">本次消耗</span>
        <span class="stat usage-tokens"></span>
        <span class="sep">·</span>
        <span class="stat usage-cost"></span>
        <span class="sep">·</span>
        <span class="stat usage-calls"></span>
        <span class="stat usage-time"></span>
        <button class="expand" type="button" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          明细
        </button>
        <div class="usage-detail"></div>
      </div>
    </div>`;

  column.appendChild(el);
  scrollDown();

  // 「本次消耗」的展开/收起
  const usageBar = el.querySelector('.usage-bar');
  const usageToggle = el.querySelector('.usage-bar .expand');
  usageToggle.onclick = () => {
    const open = usageBar.classList.toggle('open');
    usageToggle.setAttribute('aria-expanded', String(open));
  };

  return {
    el,
    trace: wireTrace(el),
    txt: el.querySelector('.txt'),
    figs: el.querySelector('.answer-figs'),
    warn: el.querySelector('.answer-warn'),   // 「内容来自网络」横幅，纯联网作答时才显示
    usage: {
      bar: usageBar,
      tokens: el.querySelector('.usage-tokens'),
      cost: el.querySelector('.usage-cost'),
      calls: el.querySelector('.usage-calls'),
      time: el.querySelector('.usage-time'),
      detail: el.querySelector('.usage-detail'),
      last: null,          // 最近一次收到的用量，final 时用它定格
    },
    paused: false,      // 本轮是否已被用户暂停（暂停后忽略后续 trace）
  };
}

/* 往执行流里追加一行 —— 纯 DOM 追加，块的显隐与状态由调用方管
   （实时轮次走 addTraceLine；历史还原直接用它铺满再置静态态） */
function appendTraceLine(t, d) {
  const text = traceText(d);
  const line = document.createElement('div');
  line.className = 'trace-line' + (d.kind === 'node' ? ' sub' : '');
  line.innerHTML = `<span class="tk">${d.kind === 'node' ? '│' : '·'}</span>${esc(text)}`;
  line.title = text;                       // 长内容被截断时悬停看全文
  t.lines.appendChild(line);
  t.n += 1;
  t.count.textContent = String(t.n);
  t.body.scrollTop = t.body.scrollHeight;  // 行多了块内滚动，不动主聊天区的阅读位置
}

/* 实时事件到达：确保执行流块可见、处于「运行中」，撤掉占位行，再追加 */
function addTraceLine(ctx, d) {
  const t = ctx.trace;
  if (t.root.hidden) {
    t.root.hidden = false;
    t.root.classList.add('open', 'running');
    t.head.setAttribute('aria-expanded', 'true');
  }
  dropPlaceholder(t);
  appendTraceLine(t, d);
}

/* 轮次开始时先把执行流亮出来（占位一行「正在处理…」）——
   首条真实事件要等主 agent 第一次模型调用返回（约 2~3 秒，长问题更久），
   在此之前不能给用户一片空白，看起来像卡死了 */
function beginTrace(ctx) {
  const t = ctx.trace;
  if (!t.root.hidden) return;
  t.root.hidden = false;
  t.root.classList.add('open', 'running');
  t.head.setAttribute('aria-expanded', 'true');
  const line = document.createElement('div');
  line.className = 'trace-line placeholder';
  line.innerHTML = '<span class="tk">·</span>正在处理…';
  t.lines.appendChild(line);
  t.placeholder = line;
}

function dropPlaceholder(t) {
  if (t.placeholder) { t.placeholder.remove(); t.placeholder = null; }
}

/* 收尾：停呼吸、收起（答案占主视野），标题换终态。
   一个真实事件都没来（护栏拒答这类零步骤轮）→ 整块隐藏，不留「0 步」的空壳 */
function closeTrace(ctx, title) {
  const t = ctx.trace;
  if (t.root.hidden) return;
  dropPlaceholder(t);
  if (!t.n) { t.root.hidden = true; return; }
  t.root.classList.remove('running', 'open');
  t.head.setAttribute('aria-expanded', 'false');
  t.title.textContent = title;
}

/* ============================================================
   用户主动暂停
   ============================================================ */
function setPauseVisible(on) {
  const btn = $('pause');
  btn.hidden = !on;
  btn.disabled = false;
}

async function requestPause() {
  // 暂停信号**必须带 run_id**：sessionId 是跨轮复用的，只按 session 发的话，
  // 上一轮迟到的暂停会误杀下一轮（后端 request_stop 会校验，不匹配就作废）
  if (!busy || !runId) return;
  $('pause').disabled = true;
  $('hint').textContent = '正在暂停…';
  try {
    const r = await fetch(`/query/${encodeURIComponent(sessionId)}/stop`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ run_id: runId }),
    });
    const d = await r.json();
    // stopped=false 表示这一轮恰好已经跑完了。不是错误，正常收尾即可
    if (!d.stopped) {
      $('hint').textContent = '本轮已结束，无需暂停';
      $('pause').disabled = true;
    }
  } catch (_) {
    $('hint').textContent = '暂停请求失败';
    $('pause').disabled = false;
  }
}

/* 半截答案保留在屏上，但压暗并标明「未完成」——它是作废的内容 */
function markPaused(ctx) {
  const body = ctx.el.querySelector('.answer-body');
  if (!body) return;
  body.classList.add('paused');
  const badge = document.createElement('div');
  badge.className = 'paused-badge';
  badge.textContent = '已暂停 · 本轮回答未完成';
  body.insertBefore(badge, body.firstChild);
  // 检索阶段就暂停的情形：一个字都没生成，给个明确的占位，别留一片空白
  if (!ctx.txt.textContent.trim()) ctx.txt.textContent = '（尚未开始生成内容）';
}

/* 纯联网作答时挂「内容来自网络，仅供参考」的横幅。
   后端只在「向量库一条都没搜到」时才把 web_only 置真 —— 所以这条横幅的意思是
   「知识库里没有相关内容，这是网上找的」，而不是「答案里掺了网络信息」 */
function renderWebWarn(ctx, webOnly) {
  if (ctx.warn) ctx.warn.hidden = !webOnly;
}

/* 渲染答案配图：带标号与图注的图卡；点图在新标签页看原图 */function renderImages(ctx, images) {
  const list = images || [];
  if (!list.length) { ctx.figs.innerHTML = ''; return; }
  ctx.figs.innerHTML =
    `<div class="figs-head">相关图片 · ${list.length} 张</div>` +
    '<div class="figs-grid">' +
    list.map((it, i) => `
      <figure class="fig">
        <img src="${esc(it.url)}" alt="${esc(it.caption || '参考图片')}" loading="lazy"
             onclick="window.open(this.src,'_blank')">
        <figcaption><span class="fig-no">图 ${i + 1}</span>${esc(it.caption || '未标注来源')}</figcaption>
      </figure>`).join('') +
    '</div>';
}

/* ============================================================
   本次消耗：随每次模型调用结束实时跳动
   ============================================================ */
function fmtTokens(n) {
  n = n || 0;
  if (n < 1000) return String(n);
  if (n < 10000) return (n / 1000).toFixed(2).replace(/\.?0+$/, '') + 'k';
  return (n / 1000).toFixed(1) + 'k';
}
/* 单次问答的成本在分以下，用四位小数会全被抹成 0，所以小值多给两位 */
function fmtCost(v) {
  v = v || 0;
  if (!v) return '0';
  return v < 0.001 ? v.toFixed(6) : v.toFixed(4);
}
/* 数值变化时闪一下强调色：不然数字悄悄改了，看不出「又花了一笔」 */
function setStat(el, html) {
  if (el.innerHTML === html) return;
  el.innerHTML = html;
  const b = el.querySelector('b');
  if (b) {
    b.classList.remove('bump');
    void b.offsetWidth;          // 强制回流，否则连续两次加同一个 class 不重播动画
    b.classList.add('bump');
  }
}

/* 两段用量相加：确认产品之后恢复的那一段，后端累计是从 0 重新开始的，
   前端把挂起前的基数补上去，否则「本次消耗」会突然变小、像是钱退回来了 */
function addUsage(base, u) {
  const n = (x) => x || 0;
  return {
    calls: n(u.calls) + n(base.calls),
    prompt_tokens: n(u.prompt_tokens) + n(base.prompt_tokens),
    completion_tokens: n(u.completion_tokens) + n(base.completion_tokens),
    failed: n(u.failed) + n(base.failed),
    unpriced_calls: n(u.unpriced_calls) + n(base.unpriced_calls),
    cost: n(u.cost) + n(base.cost),
    elapsed_ms: n(u.elapsed_ms) + n(base.elapsed_ms),
    by_node: [...(base.by_node || []), ...(u.by_node || [])],
  };
}

function renderUsage(ctx, usage, running) {
  if (!usage) return;
  const u = ctx.usage;
  u.lastRaw = usage;                    // 原始分段值：收尾时拿它再算一次，避免基数被重复相加
  const shown = ctx.usageBase ? addUsage(ctx.usageBase, usage) : usage;
  u.last = shown;
  u.bar.hidden = false;
  u.bar.classList.toggle('done', running === false);

  setStat(u.tokens, `↑ <b>${fmtTokens(shown.prompt_tokens)}</b> ↓ <b>${fmtTokens(shown.completion_tokens)}</b>`);
  setStat(u.cost, `¥<b>${fmtCost(shown.cost)}</b>`);
  setStat(u.calls, `<b>${shown.calls}</b> 次调用`
    + (shown.failed ? ` <span class="fail">${shown.failed} 失败</span>` : '')
    + (shown.unpriced_calls ? ` <span class="note">${shown.unpriced_calls} 次未计价</span>` : ''));
  // 耗时只在结束后显示：进行中它只随调用结束跳一下，读着像卡住了
  u.time.innerHTML = running === false
    ? `<span class="sep">·</span> ${(shown.elapsed_ms / 1000).toFixed(1)}s`
    : '';

  const rows = (shown.by_node || []).map(it => `
    <div class="usage-row">
      <span class="who">${esc((it.node || '—').replace(/^node_/, ''))}</span>
      <span class="num">${it.calls} 次</span>
      <span class="num">${fmtTokens(it.tokens)}</span>
      <span class="num cost">¥${fmtCost(it.cost)}</span>
    </div>`).join('');
  u.detail.innerHTML = rows
    ? `<div class="usage-row head"><span class="who">按节点</span><span class="num">调用</span>`
      + `<span class="num">tokens</span><span class="num cost">成本</span></div>${rows}`
    : '';
}

/* ============================================================
   发送
   ============================================================ */
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 148) + 'px';
});
$('send').onclick = send;
$('pause').onclick = requestPause;

async function send() {
  const query = $('input').value.trim();
  if (!query || busy) return;

  const isStream = $('streamToggle').checked;
  busy = true;
  $('send').disabled = true;
  // 暂停只对流式有意义：非流式是一次同步调用，中途无处可断
  setPauseVisible(isStream);
  $('input').value = '';
  $('input').style.height = 'auto';
  $('hint').textContent = '处理中…';

  // 首次提问时清掉空状态
  const empty = column.querySelector('.empty-state');
  if (empty) column.innerHTML = '';

  addUser(query);
  const ctx = addAnswer();

  if (isStream) {
    beginTrace(ctx);   // 立刻给出「在干活」的反馈（首条真实事件要等第一次模型调用）
    await streamFlow(query, ctx);
  }
  else await syncFlow(query, ctx);
}

/* ============================================================
   订阅事件流：一轮要挂的监听器都在这里
   ============================================================ */
function openStream(ctx, connText) {
  setConn(connText, 'busy');

  // 顺序不能反：先订阅、再提交问题，否则早期事件会推给尚未创建的队列
  if (eventSource) { eventSource.close(); eventSource = null; }
  eventSource = new EventSource(`/stream/${sessionId}`);

  eventSource.addEventListener('ready', () => {
    setConn('已连接', 'busy');
  });

  // 统一执行流（M5）：主 agent 的调度步骤 + subagent 图内节点，逐行追加灰字。
  // **答案不逐字流式**（一期协议不发 delta，见 proto），所以执行流就是中途唯一的动静
  eventSource.addEventListener('trace', (e) => {
    if (ctx.paused) return;                  // 暂停后到达的收尾步骤不再上屏
    try { addTraceLine(ctx, JSON.parse(e.data)); } catch (_) {}
  });

  // 每有一次模型调用结束就推一次：边看答案边看钱
  eventSource.addEventListener('usage', (e) => {
    try { renderUsage(ctx, JSON.parse(e.data), true); } catch (_) {}
  });

  // 用户主动暂停：本轮**没有 final**，所以收尾要在这里逐项补上，
  // 否则会留下一直呼吸的执行流、一直转的消耗圆点、以及停在「处理中…」的提示。
  // **不反问用户**：想把答案改成什么样，用户自己重新提问即可
  eventSource.addEventListener('paused', () => {
    ctx.paused = true;
    closeTrace(ctx, '已暂停');
    renderUsage(ctx, ctx.usage.lastRaw, false);    // 停圆点：把已经花掉的那部分定格
    markPaused(ctx);
    setConn('已暂停', 'on');
    $('hint').textContent = '已暂停 · 可直接重新提问';
    finish();
  });

  eventSource.addEventListener('final', (e) => {
    const d = JSON.parse(e.data);
    paintAnswer(ctx, d.answer || '');
    renderImages(ctx, d.images);
    renderWebWarn(ctx, d.web_only);
    closeTrace(ctx, '执行流');                 // 收起执行流，让答案占主视野
    // 用最后一次用量定格（换成已完成态：圆点停跳、补上总耗时）
    renderUsage(ctx, ctx.usage.lastRaw, false);
    setConn('已完成', 'on');
    $('hint').textContent = '就绪';
    finish();
  });

  eventSource.addEventListener('error', (e) => {
    let msg = '连接异常';
    try { if (e.data) msg = JSON.parse(e.data).error || msg; } catch (_) {}
    ctx.txt.textContent = msg;
    closeTrace(ctx, '执行出错');
    renderUsage(ctx, ctx.usage.lastRaw, false);   // 出错也要让消耗条停下，别一直转
    setConn('异常', 'err');
    finish();
  });

  eventSource.onerror = () => {
    if (busy) setConn('连接中断', 'err');
  };
}

/* 流式：订阅事件流 → 提交问题 */
async function streamFlow(query, ctx) {
  openStream(ctx, '订阅中');
  await new Promise(r => setTimeout(r, 250));
  try {
    const r = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, session_id: sessionId, is_stream: true,
                             enable_web_search: $('webToggle').checked }),
    });
    const d = await r.json();
    if (d.session_id) { sessionId = d.session_id; rememberSession(sessionId); }
    runId = d.run_id || null;   // 暂停要把它带回后端
  } catch (e) {
    ctx.txt.textContent = '无法连接后端服务，请确认已启动（端口 8002）。';
    closeTrace(ctx, '执行出错');   // 提交都没成功：撤掉「正在处理…」占位
    setConn('未连接', 'err');
    finish();
  }
}

/* 非流式：一次请求拿完整答案（没有事件流，也就没有执行流可看） */
async function syncFlow(query, ctx) {
  setConn('处理中', 'busy');
  ctx.txt.textContent = '正在处理…';
  try {
    const r = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, session_id: sessionId, is_stream: false,
                             enable_web_search: $('webToggle').checked }),
    });
    const d = await r.json();
    if (d.session_id) { sessionId = d.session_id; rememberSession(sessionId); }
    runId = d.run_id || null;
    // 超预算中止这类「主动结束」：后端会带 error，优先显示它，别显示成空的答案
    paintAnswer(ctx, d.error ? d.error : (d.answer || '（未返回答案）'));
    renderImages(ctx, d.images);
    renderWebWarn(ctx, d.web_only);
    renderUsage(ctx, d.usage, false);
    setConn('已完成', 'on');
    $('hint').textContent = '就绪';
  } catch (e) {
    ctx.txt.textContent = '无法连接后端服务，请确认已启动（端口 8002）。';
    setConn('未连接', 'err');
  }
  finish();
}

function finish() {
  if (eventSource) { eventSource.close(); eventSource = null; }
  busy = false;
  setPauseVisible(false);
  $('send').disabled = false;
  $('input').focus();
  scrollDown();
  // 这一轮刚写进历史：标题（取自第一条提问）与「最近活跃」都可能变了，顺手刷新列表
  loadSessions();
}

/* ============================================================
   启动时探测后端
   ============================================================ */
(async function ping() {
  try {
    const d = await (await fetch('/health')).json();
    setConn(d.ok ? '就绪' : '异常', d.ok ? 'on' : 'err');
  } catch (_) {
    setConn('未连接', 'err');
    $('hint').textContent = '后端未启动 · 端口 8002';
  }
})();
</script>
