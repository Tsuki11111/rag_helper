name: Tests

# 每次 push / PR 在全新的 Ubuntu 机器上跑一遍回归套件。价值在「干净环境」：
# 没有本机 Docker（Milvus / Mongo / Redis / Neo4j 都没有）、没有 .env ——
# 依赖不可用的用例按项目设计**自动 SKIP 而不是 FAIL**（退出码仍为 0），
# 纯逻辑用例照常全跑。它钉住的是「干净机器上装得上、import 得了、逻辑自洽」这条底线；
# 完整的端到端回归（真连库）仍在开发机上跑。
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:        # 允许在 Actions 页面手动触发

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 用 uv（项目包管理器）：先装 uv，再按 uv.lock 原样同步依赖。
      # --frozen：lock 与 pyproject 不一致时直接失败，而不是偷偷重解析
      - name: 安装 uv 并同步依赖
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen

      - name: 回归套件（无依赖环境：相关用例自动 SKIP）
        run: uv run --frozen python -m app.core.regression
