<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAG_HELPER · AGENT GALAXY</title>
<style>
  :root {
    --bg0:#02040b; --bg1:#050a18; --bg2:#071225;
    --ink:#dbe9ff; --muted:#7e93b8; --dim:#4a5a78;
    --line:rgba(120,170,255,.14);
    --cyan:#67e8f9; --gold:#ffd27a; --violet:#c4a7ff;
    --green:#7dffc4; --orange:#ffab6b; --blue:#78a9ff;
    --pink:#ff8bd6; --teal:#5eead4; --slate:#94a3b8;
    --panel:rgba(8,15,30,.88);
  }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#02040b; color:var(--ink); }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: default;
    user-select: none;
  }
  #space { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,2,10,.38) 100%),
      linear-gradient(180deg, rgba(0,0,0,.35), transparent 22%, transparent 74%, rgba(0,0,0,.5));
  }
  #grain {
    position:fixed; inset:0; z-index:3; pointer-events:none; opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/></svg>");
  }

  /* ── HUD shell ─────────────────────────────────── */
  header {
    position:fixed; z-index:10; top:18px; left:22px; right:22px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:18px;
    pointer-events:none;
  }
  header > * { pointer-events:auto; }
  .brand { display:flex; align-items:center; gap:13px; min-width:0; }
  .brand-mark {
    width:44px; height:44px; border-radius:50%; position:relative; flex:0 0 auto;
    border:1px solid rgba(103,232,249,.38);
    box-shadow:0 0 24px rgba(103,232,249,.16), inset 0 0 18px rgba(103,232,249,.08);
    background:radial-gradient(circle at 35% 30%, rgba(103,232,249,.24), rgba(5,10,24,.2) 55%, transparent 70%);
  }
  .brand-mark::before, .brand-mark::after {
    content:""; position:absolute; border-radius:50%;
    border:1px solid rgba(196,167,255,.55);
  }
  .brand-mark::before { inset:9px 3px; transform:rotate(28deg); }
  .brand-mark::after { inset:3px 12px; transform:rotate(-32deg); border-color:rgba(255,210,122,.5); }
  .brand-mark i {
    position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%; background:#fff; box-shadow:0 0 12px #fff,0 0 30px var(--cyan);
  }
  h1 {
    margin:0; font-size:20px; font-weight:700; letter-spacing:.22em; line-height:1;
    background:linear-gradient(100deg,#f4fbff 0%,#9ae8ff 40%,#c4a7ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(103,232,249,.18));
    white-space:nowrap;
  }
  .sub {
    margin-top:7px; font-size:10px; color:var(--muted); letter-spacing:.14em;
    text-transform:uppercase; white-space:nowrap;
  }
  .sub b { color:var(--gold); font-weight:600; }
  .header-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .search {
    display:flex; align-items:center; gap:8px; width:250px; height:34px;
    border:1px solid rgba(120,170,255,.22); border-radius:9px;
    background:rgba(5,12,25,.2); padding:0 10px;
    backdrop-filter:blur(12px);
    transition:border-color .2s, box-shadow .2s;
  }
  .search:focus-within { border-color:rgba(103,232,249,.55); box-shadow:0 0 0 3px rgba(103,232,249,.08); }
  .search svg { width:14px; height:14px; flex:0 0 auto; opacity:.6; }
  .search input {
    width:100%; background:none; border:0; outline:none; color:var(--ink);
    font-size:12px; font-family:inherit; letter-spacing:.02em;
  }
  .search input::placeholder { color:#586b8c; }
  .search kbd {
    font-family:inherit; font-size:9px; color:var(--dim); border:1px solid rgba(120,170,255,.22);
    border-radius:4px; padding:1px 4px; line-height:1;
  }
  button {
    font-family:inherit; color:#bcd2ee; background:rgba(7,14,28,.18);
    border:1px solid rgba(120,170,255,.2); border-radius:8px; height:34px;
    padding:0 11px; font-size:11px; letter-spacing:.04em; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    backdrop-filter:blur(12px); transition:all .18s;
  }
  button:hover { color:#fff; border-color:rgba(103,232,249,.55); background:rgba(15,33,55,.3); box-shadow:0 0 18px rgba(103,232,249,.1); }
  button.active { color:#03111b; background:linear-gradient(100deg,var(--cyan),var(--teal)); border-color:transparent; box-shadow:0 0 22px rgba(103,232,249,.24); }
  button svg { width:13px; height:13px; }

  /* ── left legend ────────────────────────────────── */
  #legend {
    position:fixed; z-index:9; left:22px; bottom:52px; width:212px;
    border:1px solid rgba(120,170,255,.14); border-radius:12px;
    background:linear-gradient(180deg,rgba(7,15,30,.18),rgba(4,9,20,.26));
    backdrop-filter:blur(14px); padding:12px 12px 10px;
    box-shadow:0 18px 50px rgba(0,0,0,.28);
  }
  .legend-title {
    display:flex; justify-content:space-between; align-items:center;
    font-size:9px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase;
    padding-bottom:9px; border-bottom:1px solid rgba(120,170,255,.12); margin-bottom:8px;
  }
  .legend-title span:last-child { color:var(--dim); letter-spacing:.08em; }
  .legend-item {
    display:flex; align-items:center; gap:9px; padding:5px 6px; border-radius:6px;
    cursor:pointer; transition:background .16s,opacity .16s;
  }
  .legend-item:hover { background:rgba(120,170,255,.07); }
  .legend-item.muted { opacity:.28; }
  .legend-dot { width:7px; height:7px; border-radius:50%; box-shadow:0 0 9px currentColor; flex:0 0 auto; }
  .legend-name { font-size:11px; color:#b8cae6; flex:1; letter-spacing:.02em; }
  .legend-count { font-size:9px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .legend-tip {
    margin-top:8px; padding-top:8px; border-top:1px solid rgba(120,170,255,.1);
    color:#5f7394; font-size:9px; line-height:1.7; letter-spacing:.02em;
  }
  .legend-tip b { color:var(--gold); font-weight:500; }

  /* ── bottom HUD ─────────────────────────────────── */
  #hud {
    position:fixed; z-index:9; right:22px; bottom:20px; display:flex; align-items:center; gap:13px;
    color:#5f7394; font-size:10px; letter-spacing:.06em; pointer-events:none;
  }
  #hud .stat b { color:#bcd2ee; font-weight:600; }
  #hud .sep { width:1px; height:10px; background:rgba(120,170,255,.18); }
  #hints {
    position:fixed; z-index:9; left:50%; bottom:20px; transform:translateX(-50%);
    color:#536785; font-size:10px; letter-spacing:.08em; white-space:nowrap; pointer-events:none;
  }
  #hints b { color:#9db6d8; font-weight:500; }
  #pulse {
    position:fixed; z-index:9; left:22px; bottom:20px; display:flex; align-items:center; gap:8px;
    color:#5a708f; font-size:9px; letter-spacing:.14em; pointer-events:none;
  }
  #pulse i {
    width:5px; height:5px; border-radius:50%; background:var(--green);
    box-shadow:0 0 10px var(--green); animation:blink 2.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:.35} 50%{opacity:1} }

  /* ── tooltip ────────────────────────────────────── */
  #tooltip {
    position:fixed; z-index:30; pointer-events:none; opacity:0; transform:translateY(4px);
    transition:opacity .14s, transform .14s; max-width:280px;
    background:rgba(6,13,27,.55); border:1px solid rgba(120,190,255,.3);
    border-radius:9px; padding:9px 11px; box-shadow:0 12px 34px rgba(0,0,0,.5);
    backdrop-filter:blur(14px);
  }
  #tooltip.show { opacity:1; transform:translateY(0); }
  #tooltip .tt-cat { font-size:8px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px; }
  #tooltip .tt-name { font-size:12px; color:#eef8ff; font-weight:600; margin-bottom:3px; }
  #tooltip .tt-tech { font-size:10px; color:#8da7c9; line-height:1.5; }
  #tooltip .tt-hint { margin-top:7px; padding-top:6px; border-top:1px solid rgba(120,170,255,.16); color:#5c7293; font-size:9px; }

  /* ── detail panel ───────────────────────────────── */
  #panel {
    position:fixed; z-index:20; top:78px; right:22px; bottom:22px; width:min(470px, calc(100vw - 44px));
    display:flex; flex-direction:column;
    border:1px solid rgba(120,190,255,.22); border-radius:14px;
    background:linear-gradient(180deg,rgba(9,18,36,.1),rgba(5,11,24,.16));
    box-shadow:0 28px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter:blur(22px);
    transform:translateX(calc(100% + 30px)); opacity:0; pointer-events:none;
    transition:transform .34s cubic-bezier(.2,.8,.2,1), opacity .24s;
    overflow:hidden;
    max-height:calc(100vh - 16px);
  }
  #panel.open { transform:translateX(0); opacity:1; pointer-events:auto; }
  .panel-head { padding:17px 18px 13px; border-bottom:1px solid rgba(120,170,255,.12); position:relative; flex:0 0 auto; }
  .panel-head::before {
    content:""; position:absolute; left:18px; right:18px; top:0; height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.8;
  }
  .panel-head { cursor:grab; touch-action:none; user-select:none; }
  .panel-head:active { cursor:grabbing; }
  .panel-close { cursor:pointer; }
  #panel.dragging { transition:none !important; }
  #panel.dragging .panel-head { cursor:grabbing; }
  .panel-kicker { display:flex; align-items:center; gap:8px; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  .panel-kicker .dot { width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 9px var(--accent); }
  .panel-close {
    position:absolute; top:12px; right:12px; width:28px; height:28px; padding:0; justify-content:center;
    border-radius:7px; background:rgba(255,255,255,.03);
  }
  .panel-title { margin-top:9px; font-size:22px; font-weight:700; letter-spacing:.02em; color:#f3faff; line-height:1.25; }
  .panel-sub { margin-top:4px; font-size:11px; color:#88a0c2; letter-spacing:.04em; }
  .panel-body { padding:15px 18px 22px; overflow:auto; flex:1 1 auto; scrollbar-width:thin; scrollbar-color:rgba(120,170,255,.3) transparent; text-shadow:0 1px 10px rgba(0,0,0,.8); }
  .panel-body::-webkit-scrollbar { width:6px; }
  .panel-body::-webkit-scrollbar-thumb { background:rgba(120,170,255,.26); border-radius:3px; }
  .panel-desc { font-size:12px; line-height:1.85; color:#b9cde8; margin:0 0 14px; }
  .panel-desc strong { color:#fff; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:15px; }
  .chip {
    display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:5px;
    border:1px solid color-mix(in srgb,var(--accent) 35%, transparent);
    background:color-mix(in srgb,var(--accent) 7%, transparent);
    color:#cfe8f7; font-size:10px; line-height:1.2; letter-spacing:.02em;
  }
  .chip.related { cursor:pointer; border-color:rgba(120,170,255,.22); background:rgba(120,170,255,.05); color:#a9c1df; }
  .chip.related:hover { border-color:var(--accent); color:#fff; }
  .sec-label { display:flex; align-items:center; gap:8px; margin:16px 0 8px; font-size:9px; color:#7188a8; letter-spacing:.16em; text-transform:uppercase; }
  .sec-label::after { content:""; flex:1; height:1px; background:rgba(120,170,255,.1); }
  .file-row {
    display:flex; align-items:flex-start; gap:8px; padding:7px 9px; border-radius:6px;
    background:rgba(120,170,255,.045); border:1px solid rgba(120,170,255,.1);
    font-family:"Cascadia Code","SFMono-Regular",Consolas,monospace; font-size:10px;
    color:#8fa9c9; word-break:break-all; line-height:1.55;
  }
  .file-row svg { width:12px; height:12px; flex:0 0 auto; margin-top:1px; opacity:.7; }
  .code-block { border:1px solid rgba(120,170,255,.14); border-radius:8px; overflow:hidden; margin:8px 0 12px; background:rgba(2,7,15,.14); }
  .code-block summary {
    cursor:pointer; list-style:none; padding:8px 11px; display:flex; align-items:center; gap:8px;
    color:#8ca7c8; font-size:10px; letter-spacing:.02em; border-bottom:1px solid transparent;
    background:rgba(120,170,255,.035);
  }
  .code-block[open] summary { border-bottom-color:rgba(120,170,255,.1); color:#c5dcf4; }
  .code-block summary::-webkit-details-marker { display:none; }
  .code-block summary .arrow { margin-left:auto; transition:transform .18s; font-size:9px; color:#5f7595; }
  .code-block[open] summary .arrow { transform:rotate(90deg); }
  .code-block pre { margin:0; padding:11px 12px; overflow:auto; max-height:340px; scrollbar-width:thin; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  .code-block code { font-family:"Cascadia Code","SFMono-Regular",Consolas,monospace; font-size:10px; line-height:1.65; color:#b8d2ee; white-space:pre; }
  .kw { color:#c4a7ff; } .st { color:#a7e8b8; } .cm { color:#5e7596; font-style:italic; } .num { color:#ffd27a; }
  .talk {
    border-left:2px solid var(--accent); padding:9px 11px; margin:10px 0 14px;
    background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 6%, transparent),transparent);
    color:#a9c3de; font-size:11px; line-height:1.8;
  }
  .talk b { display:block; color:var(--accent); font-size:9px; letter-spacing:.14em; margin-bottom:4px; font-weight:500; }
  .foot-note { margin-top:16px; padding-top:10px; border-top:1px solid rgba(120,170,255,.1); color:#5d7392; font-size:9px; line-height:1.7; }

  /* ── responsive ─────────────────────────────────── */
  @media (max-width: 1000px) {
    header { top:12px; left:14px; right:14px; }
    h1 { font-size:16px; letter-spacing:.16em; }
    .sub { font-size:8px; }
    .search { width:190px; }
    .header-actions button span { display:none; }
    .header-actions button { padding:0 9px; }
    #legend { left:14px; bottom:48px; width:180px; padding:10px; }
    .legend-name { font-size:10px; }
    #hints { display:none; }
    #panel { top:66px; right:14px; bottom:14px; width:min(430px, calc(100vw - 28px)); }
    #hud { right:14px; bottom:14px; }
    #pulse { left:14px; bottom:14px; }
  }
  @media (max-width: 680px) {
    .brand-mark { width:32px; height:32px; }
    h1 { font-size:13px; }
    .sub { font-size:7px; letter-spacing:.08em; }
    .header-actions { gap:5px; }
    .search { width:135px; height:30px; padding:0 8px; }
    .search kbd { display:none; }
    .header-actions button { height:30px; font-size:10px; }
    #tour { display:none; }
    #legend { display:none; }
    #panel { top:58px; right:8px; bottom:8px; width:calc(100vw - 16px); border-radius:11px; }
    .panel-title { font-size:19px; }
    #hud { display:none; }
    #pulse { display:none; }
    #hints { display:none; }
  }
</style>

<body>
<canvas id="space"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<header>
  <div class="brand">
    <div class="brand-mark"><i></i></div>
    <div>
      <h1>AGENT GALAXY</h1>
      <div class="sub">RAG_HELPER · 买小购 / 项目逻辑星图 · <b>LIVE MAP</b></div>
    </div>
  </div>
  <div class="header-actions">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="搜索节点 / 技术 / 文件…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <button id="auto" class="active" title="自动旋转">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>自动旋转</span>
    </button>
    <button id="tour" title="按主链路巡游">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg><span>主线巡游</span>
    </button>
    <button id="reset" title="重置视角">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v7h7"/></svg><span>重置</span>
    </button>
  </div>
</header>

<aside id="legend">
  <div class="legend-title"><span>SYSTEMS</span><span id="legend-count">9 STAR SYSTEMS</span></div>
  <div id="legend-items"></div>
  <div class="legend-tip">拖动旋转 · 滚轮缩放<br><b>点击节点</b>展开代码实现</div>
</aside>

<aside id="panel" aria-live="polite"></aside>

<div id="tooltip"></div>

<div id="hud">
  <div class="stat"><b id="stat-nodes">0</b> NODES</div>
  <div class="sep"></div>
  <div class="stat"><b id="stat-links">0</b> LINKS</div>
  <div class="sep"></div>
  <div class="stat">ZOOM <b id="stat-zoom">1.0</b>×</div>
</div>
<div id="hints"><b>拖拽</b> 旋转星图 &nbsp;·&nbsp; <b>滚轮</b> 缩放 &nbsp;·&nbsp; <b>点击节点</b> 展开实现 &nbsp;·&nbsp; <b>空格</b> 暂停旋转</div>
<div id="pulse"><i></i> SIGNAL STABLE · 8003</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════
   数据：节点 / 系统 / 关系
   ═══════════════════════════════════════════════════════════════ */
const CATS = [
  { id:"gateway", name:"接入与契约", en:"GATEWAY", color:"#67e8f9", center:[-11, 4.5, 2], desc:"Java 只从这里进入；身份、会话归属、事件契约都在边界收口。" },
  { id:"runtime", name:"运行时", en:"HARNESS", color:"#ffd27a", center:[0, 2, 0], desc:"一轮问答的生命周期：护栏、短路、上下文、预算、停止、收尾。" },
  { id:"orchestration", name:"Agent 编排", en:"ORCHESTRATION", color:"#c4a7ff", center:[8, 6, -2], desc:"主 Agent 唯一出口；子 Agent 按职责隔离上下文，只回结果。" },
  { id:"retrieval", name:"RAG 检索", en:"RETRIEVAL", color:"#7dffc4", center:[-7, -2, 5], desc:"四路召回 → RRF → rerank → 充分性门 → 有界改写 → 答案。" },
  { id:"ingest", name:"知识导入", en:"INGESTION", color:"#5eead4", center:[-5, 8.5, -5], desc:"解析、切图、切分、产品主体识别、向量化、入库与图谱。" },
  { id:"tools", name:"工具与权限", en:"TOOLS", color:"#ffab6b", center:[9, -1, 3], desc:"工具网关、票据、预检、HITL；Agent 不直接拥有执行权。" },
  { id:"state", name:"状态与存储", en:"STATE", color:"#78a9ff", center:[-10, -5.5, -4], desc:"会话历史、运行记录、账本、检查点、Redis 任务状态。" },
  { id:"obs", name:"可观测与评测", en:"OBSERVABILITY", color:"#ff8bd6", center:[4, -6.5, -4], desc:"Trace 事件、用量账本、LLM-as-Judge、知识缺口闭环。" },
  { id:"deploy", name:"部署与边界", en:"DEPLOY", color:"#94a3b8", center:[0, -9, -7], desc:"联合部署、单实例边界，以及面试时要主动讲清楚的技术债。" }
];

const NODES = [
  {
    "id": "grpc",
    "label": "gRPC 接入",
    "en": "Converse / 8003",
    "cat": "gateway",
    "weight": 3,
    "summary": "生产入口。同步 gRPC + 8 线程池；Converse 把同步的 run_main_agent 放进 worker 线程，事件经 queue 流回生成器，再映射成 proto Event。",
    "tech": "gRPC · ThreadPool(8) · queue",
    "file": "app/agent/api/grpc_service.py:149",
    "talk": "gRPC 只是边界，真正难的是同步执行函数如何安全地流式回传事件；我用 worker + queue 做桥接，没有把运行时改成 async。",
    "snippets": [
      {

        "code": "def request_stop(session_id: str, run_id: str) -> bool:\n    \"\"\"\n    请求暂停当前这一轮。\n\n    **必须带上 run_id 且与当前登记一致才生效**：前端的 session_id 是跨轮复用的，\n    用户点慢了、或网络延迟导致上一轮的暂停信号在下一轮开跑之后才打到，\n    按 session 置位就会误杀新一轮。\n\n    :return: 是否真的置位；False 表示这一轮已经结束了，信号作废\n    \"\"\"\n    if _active_for(session_id) != run_id:\n        return False\n    _mem_stop[session_id] = run_id\n\n    def redis_op(c):\n        # **同时把 active 写正**：Redis 里的 active 可能因为中途降级而落后于内存\n        # （`set_active_run` 那会儿 Redis 正挂着）。只写 stop 的话，\n        # `is_stop_requested` 会读到「active 是旧轮、stop 是新轮」而判定不相等，\n        # 暂停就静默失效了。一并写正，两个后端重新对齐。\n        with c.pipeline(transaction=True) as p:\n            p.set(_k_active(session_id), run_id, ex=_ttl())\n            p.set(_k_stop(session_id), run_id, ex=_ttl())\n            p.execute()\n\n    _run(redis_op, lambda: None, f\"SET {_k_stop(session_id)}\")\n    return True"
      }
    ]
  },

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const norm = (v) => { const l = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/l,v[1]/l,v[2]/l]; };
const hash = (s) => { let h = 2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); };
const hash01 = (s) => (hash(s) % 10000) / 10000;

/* 邻接表 */
const adj = new Map(NODES.map(n => [n.id, new Set()]));

}

NODES.forEach(n => catNodes.get(n.cat).push(n));
NODES.forEach(n => {
  const c = catMap.get(n.cat);
  const peers = catNodes.get(n.cat);
  const i = peers.indexOf(n);
  const ci = catIndex.get(n.cat);
  if (i === 0) {
    n.pos = [...c.center];
    n.ring = 0;
    return;
  }
  const idx = i - 1;
  const ring = Math.floor(idx / 6);
  const within = idx % 6;
  const inRing = Math.min(6, peers.length - 1 - ring * 6);
  const angle = (within / Math.max(1, inRing)) * Math.PI * 2 + ring * 0.62 + ci * 0.47;
  const radius = 2.05 + ring * 1.45;
  n.pos = [
    c.center[0] + Math.cos(angle) * radius,
    c.center[1] + Math.sin(angle) * radius * 0.58 + (ring ? 0.25 : 0),
    c.center[2] + Math.sin(angle) * radius * 0.82 + (ring ? 0.55 : 0)
  ];
  n.ring = ring;
});

const cam = {
  yaw: 0.58, pitch: -0.14, dist: 36,
  distGoal: 36,
  target: [0, -1, 0],
  targetGoal: [0, -1, 0]
};
let W = 0, H = 0, DPR = 1;
let view = { f: 1, cx: 0, cy: 0 };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  view.f = Math.min(W, H) * 1.16;
  view.cx = W / 2;
  view.cy = H / 2;
}
window.addEventListener("resize", resize);
resize();

function project(p) {
  let x = p[0] - cam.target[0];
  let y = p[1] - cam.target[1];
  let z = p[2] - cam.target[2];

  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const x1 = x * cy + z * sy;
  const z1 = -x * sy + z * cy;

  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const y1 = y * cp - z1 * sp;
  const z2 = y * sp + z1 * cp;

  const zc = cam.dist - z2;
  if (zc < 0.8) return null;
  const k = view.f / zc;
  return {
    x: view.cx + x1 * k,
    y: view.cy - y1 * k,
    z: zc,
    k,
    p
  };
}

function initPanelDrag() {
  panelEl.addEventListener("pointerdown", e => {
    const head = e.target.closest(".panel-head");
    if (!head || e.target.closest(".panel-close")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const rect = panelEl.getBoundingClientRect();
    panelDrag = {
      pointerId: e.pointerId,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      width: rect.width,
      height: rect.height
    };
    panelEl.style.left = rect.left + "px";
    panelEl.style.top = rect.top + "px";
    panelEl.style.right = "auto";
    panelEl.style.bottom = "auto";
    panelEl.style.height = rect.height + "px";
    panelEl.classList.add("dragging");
    head.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  panelEl.addEventListener("pointermove", e => {
    if (!panelDrag || e.pointerId !== panelDrag.pointerId) return;
    const maxLeft = Math.max(8, window.innerWidth - panelDrag.width - 8);
    const maxTop = Math.max(8, window.innerHeight - panelDrag.height - 8);
    panelEl.style.left = Math.min(maxLeft, Math.max(8, e.clientX - panelDrag.offsetX)) + "px";
    panelEl.style.top = Math.min(maxTop, Math.max(8, e.clientY - panelDrag.offsetY)) + "px";
  });
  const endDrag = e => {
    if (!panelDrag) return;
    const head = panelEl.querySelector(".panel-head");
    try { if (head) head.releasePointerCapture(panelDrag.pointerId); } catch (_) {}
    panelEl.classList.remove("dragging");
    panelDrag = null;
  };
  panelEl.addEventListener("pointerup", endDrag);
  panelEl.addEventListener("pointercancel", endDrag);
}

/* ═══════════════════════════════════════════════════════════════
   星野 / 星云
   ═══════════════════════════════════════════════════════════════ */
const stars = Array.from({length: 560}, (_, i) => ({
  x: hash01("sx"+i), y: hash01("sy"+i), z: hash01("sz"+i),
  r: 0.4 + hash01("sr"+i) * 1.5,
  phase: hash01("sp"+i) * Math.PI * 2,
  speed: .5 + hash01("ss"+i) * 1.6
}));
const nebulas = [
  { x:.22, y:.26, r:.42, c:"rgba(80,120,255,.09)" },
  { x:.77, y:.20, r:.34, c:"rgba(180,100,255,.075)" },
  { x:.58, y:.72, r:.38, c:"rgba(30,200,190,.055)" },
  { x:.10, y:.76, r:.30, c:"rgba(255,120,180,.045)" }
];

function drawBackdrop(t) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#02040b");
  g.addColorStop(.46, "#050a18");
  g.addColorStop(1, "#02040b");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for (const n of nebulas) {
    const x = n.x * W + Math.sin(t * .02 + n.x * 9) * 18;
    const y = n.y * H + Math.cos(t * .018 + n.y * 8) * 14;
    const r = n.r * Math.min(W, H);
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, n.c);
    rg.addColorStop(.5, n.c.replace(/[\d.]+\)$/, ".025)"));
    rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }

  const px = Math.sin(cam.yaw) * 26, py = Math.cos(cam.yaw) * 12;
  for (const s of stars) {
    const x = ((s.x * W + px * (s.z + .4)) % W + W) % W;
    const y = ((s.y * H + py * (s.z + .2)) % H + H) % H;
    const a = .18 + .55 * Math.abs(Math.sin(t * s.speed + s.phase));
    ctx.globalAlpha = a;
    ctx.fillStyle = s.z > .72 ? "#b9e7ff" : "#8aa7c9";
    ctx.beginPath();
    ctx.arc(x, y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ═══════════════════════════════════════════════════════════════
   绘制
   ═══════════════════════════════════════════════════════════════ */
function catColor(id, a=1) {
  const c = catMap.get(id)?.color || "#8aa7c9";
  if (a >= 1) return c;
  const h = c.replace("#","");
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function edgeAlpha(e) {
  if (selectedId) {
    return (e.a === selectedId || e.b === selectedId) ? .86 : .09;
  }
  if (hoverId) {
    return (e.a === hoverId || e.b === hoverId) ? .65 : .16;
  }
  if (searchSet) {
    return (searchSet.has(e.a) || searchSet.has(e.b)) ? .32 : .045;
  }
  if (filterCat) {
    return (nodeMap.get(e.a).cat === filterCat || nodeMap.get(e.b).cat === filterCat) ? .32 : .06;
  }
  return .22;
}
function nodeVisible(n) {
  if (searchSet) return searchSet.has(n.id);
  if (filterCat) return n.cat === filterCat;
  return true;
}
function nodeDim(n) {
  if (selectedId && n.id !== selectedId) return .42;
  if (hoverId && n.id !== hoverId) return .55;
  return 1;
}

function drawOrbits() {
  for (const c of CATS) {
    for (let ring = 0; ring < 3; ring++) {
      const r = 2.05 + ring * 1.45;
      if (r > 4.9) continue;
      ctx.beginPath();
      let started = false;
      for (let i=0; i<=72; i++) {
        const a = i / 72 * Math.PI * 2;
        const p = [c.center[0] + Math.cos(a) * r, c.center[1] + Math.sin(a) * r * .58, c.center[2] + Math.sin(a) * r * .82];
        const s = project(p);
        if (!s) { started = false; continue; }
        if (!started) { ctx.moveTo(s.x, s.y); started = true; }
        else ctx.lineTo(s.x, s.y);
      }
      ctx.strokeStyle = catColor(c.id, ring === 0 ? .085 : .042);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

function drawEdges(t) {
  const sorted = edgeList.map(e => {
    const a = project(nodeMap.get(e.a).pos);
    const b = project(nodeMap.get(e.b).pos);
    if (!a || !b) return null;
    return { e, a, b, depth: (a.z + b.z) / 2 };
  }).filter(Boolean).sort((p,q) => q.depth - p.depth);

  for (const {e,a,b} of sorted) {
    const alpha = edgeAlpha(e);
    if (alpha < .02) continue;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const off = (e.curve || 0) * Math.min(72, len * .22);
    const cx = mx + nx * off, cy = my + ny * off;

    const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    grad.addColorStop(0, catColor(nodeMap.get(e.a).cat, alpha));
    grad.addColorStop(1, catColor(nodeMap.get(e.b).cat, alpha));
    ctx.strokeStyle = grad;
    ctx.lineWidth = (selectedId && (e.a===selectedId || e.b===selectedId)) ? 1.5 : .9;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(cx, cy, b.x, b.y);
    ctx.stroke();

    /* 流动粒子 */
    if (alpha > .18 && !dragging) {
      const speed = .11 + hash01(e.a+e.b) * .08;
      for (let q = 0; q < 2; q++) {
        const tt = (t * speed + q * .5 + hash01(e.a+e.b+q) * .3) % 1;
        const ix = (1-tt)*(1-tt)*a.x + 2*(1-tt)*tt*cx + tt*tt*b.x;
        const iy = (1-tt)*(1-tt)*a.y + 2*(1-tt)*tt*cy + tt*tt*b.y;
        const rr = (selectedId && (e.a===selectedId || e.b===selectedId)) ? 1.9 : 1.2;
        ctx.beginPath();
        ctx.fillStyle = catColor(nodeMap.get(e.b).cat, alpha * .9);
        ctx.shadowColor = catColor(nodeMap.get(e.b).cat, .9);
        ctx.shadowBlur = 8;
        ctx.arc(ix, iy, rr, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }
}

function drawNodes(t) {
  lastProjected = [];
  const visible = NODES.filter(nodeVisible);
  const projected = [];
  for (const n of visible) {
    const s = project(n.pos);
    if (!s) continue;
    projected.push({ n, s });
  }
  projected.sort((a,b) => b.s.z - a.s.z);

  for (const {n,s} of projected) {
    const isSel = n.id === selectedId;
    const isHover = n.id === hoverId;
    const dim = nodeDim(n);
    const base = Math.max(2.2, (0.18 + n.weight * .105) * s.k * .62);
    const r = base * (isSel ? 1.55 : isHover ? 1.32 : 1);
    const col = catColor(n.cat);
    const alpha = dim * clamp(1.22 - s.z / (cam.dist * 1.7), .28, 1);

    /* halo */
    const halo = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 5.2);
    halo.addColorStop(0, catColor(n.cat, .42 * alpha));
    halo.addColorStop(.22, catColor(n.cat, .18 * alpha));
    halo.addColorStop(1, catColor(n.cat, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 5.2, 0, Math.PI * 2);
    ctx.fill();

    /* pulse ring */
    if (isSel || isHover) {
      const pulse = 1 + Math.sin(t * 4.2) * .12;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * (2.9 + (isSel ? .5 : .15)) * pulse, 0, Math.PI * 2);
      ctx.strokeStyle = catColor(n.cat, isSel ? .6 : .38);
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    /* core */
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fillStyle = catColor(n.cat, .92 * alpha);
    ctx.shadowColor = col;
    ctx.shadowBlur = isSel ? 28 : 14;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(s.x - r * .18, s.y - r * .2, r * .42, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${.75 * alpha})`;
    ctx.fill();

    if (n.ring === 0) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * 1.65, 0, Math.PI * 2);
      ctx.strokeStyle = catColor(n.cat, .35 * alpha);
      ctx.lineWidth = .8;
      ctx.stroke();
    }

    lastProjected.push({ id:n.id, x:s.x, y:s.y, r, depth:s.z });
  }

  /* 标签：按重要性，避免重叠 */
  if (labelsOn) {
    const placed = [];
    const sortedLabels = [...lastProjected].sort((a,b) => {
      const na = nodeMap.get(a.id), nb = nodeMap.get(b.id);
      return (nb.weight - na.weight) || (a.depth - b.depth);
    });
    for (const p of sortedLabels) {
      const n = nodeMap.get(p.id);
      if (!labelsOn) break;
      if (searchSet && !searchSet.has(n.id) && n.id !== selectedId) continue;
      if (filterCat && n.cat !== filterCat && n.id !== selectedId) continue;
      if (n.weight < 2 && !selectedId && !hoverId && lastProjected.length > 45) {
        if (hash01(n.id) > .55) continue;
      }
      const fs = clamp(9.2, p.depth ? (36 / p.depth) * 7.5 : 9, 13);
      ctx.font = `${n.weight >= 3 ? 600 : 500} ${fs}px "Segoe UI","Microsoft YaHei",sans-serif`;
      const tw = ctx.measureText(n.label).width;
      const tx = p.x - tw / 2;
      const ty = p.y - p.r - 9 - fs * .25;
      const rect = [tx - 3, ty - fs, tw + 6, fs + 5];
      if (!(n.id === selectedId || n.id === hoverId)) {
        let hit = false;
        for (const q of placed) {
          if (rect[0] < q[0]+q[2] && rect[0]+rect[2] > q[0] && rect[1] < q[1]+q[3] && rect[1]+rect[3] > q[1]) { hit = true; break; }
        }
        if (hit) continue;
      }
      placed.push(rect);
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = `rgba(226,244,255,${n.weight >= 3 ? .92 : .68})`;
      ctx.shadowColor = "rgba(0,0,0,.9)";
      ctx.shadowBlur = 5;
      ctx.fillText(n.label, p.x, ty + fs * .82);
      ctx.shadowBlur = 0;
    }
  }

  /* 系统名 */
  for (const c of CATS) {
    if (filterCat && c.id !== filterCat) continue;
    const s = project(c.labelPos);
    if (!s) continue;
    const fs = clamp(9, s.k * .28, 11.5);
    ctx.font = `600 ${fs}px "Segoe UI","Microsoft YaHei",sans-serif`;
    ctx.textAlign = "center";
    ctx.fillStyle = catColor(c.id, .32);
    ctx.fillText(c.en, s.x, s.y);
    ctx.font = `400 ${Math.max(8, fs*.75)}px "Segoe UI","Microsoft YaHei",sans-serif`;
    ctx.fillStyle = catColor(c.id, .22);
    ctx.fillText(c.name, s.x, s.y + fs + 6);
  }
}

/* ═══════════════════════════════════════════════════════════════
   主循环
   ═══════════════════════════════════════════════════════════════ */
function frame(now) {
  const dt = Math.min(.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (autoRotate && !dragging) cam.yaw += dt * .045;
  cam.dist = lerp(cam.dist, cam.distGoal, Math.min(1, dt * 5));
  cam.target = cam.target.map((v,i) => lerp(v, cam.targetGoal[i], Math.min(1, dt * 6)));
  const t = now / 1000;

  drawBackdrop(t);
  drawOrbits();
  drawEdges(t);
  drawNodes(t);

  const zoom = clamp(36 / cam.dist, .5, 2.2);
  const zEl = $("#stat-zoom");
  if (zEl) zEl.textContent = zoom.toFixed(1);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ═══════════════════════════════════════════════════════════════
   Hover / 点击 / 拖拽
   ═══════════════════════════════════════════════════════════════ */
function pick(x, y) {
  let best = null, bestD = Infinity;
  for (const p of lastProjected) {
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < Math.max(13, p.r + 9) && d < bestD) { bestD = d; best = p; }
  }
  return best;
}
function updateTooltip(clientX, clientY) {
  if (!hoverId) { tooltipEl.classList.remove("show"); return; }
  const n = nodeMap.get(hoverId);
  const c = catMap.get(n.cat);
  tooltipEl.innerHTML = `<div class="tt-cat" style="color:${c.color}">${c.en} / ${esc(c.name)}</div>
    <div class="tt-name">${esc(n.label)}</div>
    <div class="tt-tech">${esc(n.tech || n.en)}</div>
    <div class="tt-hint">点击展开代码实现 →</div>`;
  const pad = 16;
  const r = tooltipEl.getBoundingClientRect();
  let x = clientX + pad, y = clientY + pad;
  if (x + r.width > window.innerWidth - 12) x = clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 12) y = clientY - r.height - pad;
  tooltipEl.style.left = x + "px";
  tooltipEl.style.top = y + "px";
  tooltipEl.classList.add("show");
}
canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  dragging = true; dragMoved = 0;
  lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  tooltipEl.classList.remove("show");
});
canvas.addEventListener("pointermove", e => {
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    cam.yaw += dx * .006;
    cam.pitch = clamp(cam.pitch + dy * .005, -1.15, 1.15);
    return;
  }
  const p = pick(e.clientX, e.clientY);
  const id = p ? p.id : null;
  if (id !== hoverId) {
    hoverId = id;
    canvas.style.cursor = id ? "pointer" : "grab";
    updateTooltip(e.clientX, e.clientY);
  } else if (id) {
    updateTooltip(e.clientX, e.clientY);
  }
});
canvas.addEventListener("pointerup", e => {
  if (!dragging) return;
  dragging = false;
  canvas.releasePointerCapture?.(e.pointerId);
  if (dragMoved < 6) {
    const p = pick(e.clientX, e.clientY);
    if (p) openNode(p.id, {focus:true});
    else closePanel();
  }
});
canvas.addEventListener("pointerleave", () => { if (!dragging) { hoverId = null; tooltipEl.classList.remove("show"); } });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  cam.distGoal = clamp(cam.distGoal * Math.exp(e.deltaY * .0012), 15, 60);
}, {passive:false});

/* ═══════════════════════════════════════════════════════════════
   Panel
   ═══════════════════════════════════════════════════════════════ */
function highlight(code) {
  const src = String(code)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  const re = /(#[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(\d+(?:\.\d+)?)\b|\b(def|class|return|if|else|elif|for|while|try|finally|yield|import|from|as|with|in|not|and|or|None|True|False|async|await|self|lambda|raise|except|pass|continue|break|global|nonlocal|assert|del|is|match|case)\b/g;
  return src.replace(re, (m, comment, str, num, kw) => {
    if (comment) return `<span class="cm">${comment}</span>`;
    if (str) return `<span class="st">${str}</span>`;
    if (num) return `<span class="num">${num}</span>`;
    return `<span class="kw">${kw}</span>`;
  });
}
function neighbors(id) {
  return [...(adj.get(id) || [])];
}
function openNode(id, opts={}) {
  if (!nodeMap.has(id)) return;
  selectedId = id;
  if (opts.focus) {
    const p = nodeMap.get(id).pos;
    cam.targetGoal = [p[0], p[1], p[2]];
    cam.distGoal = 26;
    autoRotate = false;
    $("#auto").classList.remove("active");
  }
  renderPanel();
  panelEl.classList.add("open");
  tooltipEl.classList.remove("show");
}
function closePanel() {
  selectedId = null;
  panelEl.classList.remove("open");
}
function renderPanel() {
  const n = nodeMap.get(selectedId);
  if (!n) return;
  const c = catMap.get(n.cat);
  panelEl.style.setProperty("--accent", c.color);
  const rel = neighbors(n.id).map(id => nodeMap.get(id)).filter(Boolean).slice(0, 10);
  const snippets = n.snippets || [];
  panelEl.innerHTML = `
    <div class="panel-head" title="拖动标题栏移动面板">
      <div class="panel-kicker"><i class="dot"></i>${c.en} / ${esc(c.name)}</div>
      <button class="panel-close" id="panel-close" title="关闭">✕</button>
      <div class="panel-title">${esc(n.label)}</div>
      <div class="panel-sub">${esc(n.en)}${n.tech ? " · " + esc(n.tech) : ""}</div>
    </div>
    <div class="panel-body">
      <p class="panel-desc">${n.summary}</p>
      <div class="chips">
        ${n.tech ? `<span class="chip">${esc(n.tech)}</span>` : ""}
        <span class="chip">${neighbors(n.id).length} 条关联</span>
      </div>
      ${n.talk ? `<div class="talk"><b>面试一句话</b>${n.talk}</div>` : ""}
      ${n.file ? `<div class="sec-label">代码位置</div><div class="file-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h9l7 7v9H4z"/><path d="M13 4v7h7"/></svg>${esc(n.file)}</div>` : ""}
      ${snippets.length ? `<div class="sec-label">可展开的实现</div>${snippets.map(s => `
        <details class="code-block" open>
          <summary><span class="arrow">›</span>${esc(s.label || "关键代码")}<span style="margin-left:auto;color:#5f7595">${esc(s.file || "")}</span></summary>
          <pre><code>${highlight(s.code || "")}</code></pre>
        </details>`).join("")}` : ""}
      ${rel.length ? `<div class="sec-label">相邻节点 · 可跳转</div><div class="chips">
        ${rel.map(r => `<button class="chip related" data-node="${r.id}" style="border-color:${catColor(r.cat,.3)}">${esc(r.label)}</button>`).join("")}
      </div>` : ""}
      <div class="foot-note">节点来自 rag_helper 的真实模块与调用链；展开代码为精简摘录，完整实现见文件路径。</div>
    </div>`;
  panelEl.querySelector("#panel-close").onclick = closePanel;
  panelEl.querySelectorAll(".chip.related").forEach(el => {
    el.onclick = () => openNode(el.dataset.node, {focus:true});
  });
}

/* ═══════════════════════════════════════════════════════════════
   搜索 / 图例 / 控件
   ═══════════════════════════════════════════════════════════════ */
const searchEl = $("#search");
  searchEl.addEventListener("input", () => {
  searchQuery = searchEl.value.trim().toLowerCase();
  if (!searchQuery) { searchSet = null; return; }
  filterCat = null;
  $$(".legend-item").forEach(x => x.classList.remove("muted"));
  searchSet = new Set(NODES.filter(n =>
    [n.label,n.en,n.id,n.tech,n.summary,n.file].join(" ").toLowerCase().includes(searchQuery)
  ).map(n => n.id));
});
searchEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && searchSet && searchSet.size) {
    const first = [...searchSet][0];
    openNode(first, {focus:true});
  }
  if (e.key === "Escape") { searchEl.value = ""; searchQuery = ""; searchSet = null; searchEl.blur(); }
});

const legendItems = $("#legend-items");
CATS.forEach(c => {
  const count = NODES.filter(n => n.cat === c.id).length;
  const el = document.createElement("div");
  el.className = "legend-item";
  el.dataset.cat = c.id;
  el.innerHTML = `<span class="legend-dot" style="background:${c.color};color:${c.color}"></span>
    <span class="legend-name">${c.name}</span><span class="legend-count">${count}</span>`;
  el.onclick = () => {
    filterCat = filterCat === c.id ? null : c.id;
    searchEl.value = ""; searchQuery = ""; searchSet = null;
    closePanel();
    $$(".legend-item").forEach(x => x.classList.toggle("muted", filterCat && x.dataset.cat !== filterCat));
    if (filterCat) {
      cam.targetGoal = [c.center[0]*.7, c.center[1]*.7, c.center[2]*.7];
      cam.distGoal = 27;
    } else {
      cam.targetGoal = [0,-1,0]; cam.distGoal = 36;
    }
  };
  legendItems.appendChild(el);
});

function resetView() {
  cam.yaw = .58; cam.pitch = -.14;
  cam.distGoal = 36; cam.targetGoal = [0,-1,0]; cam.target = [0,-1,0];
  filterCat = null; searchSet = null; searchEl.value = ""; searchQuery = "";
  $$(".legend-item").forEach(x => x.classList.remove("muted"));
  closePanel();
}
$("#reset").onclick = resetView;
$("#auto").onclick = () => {
  autoRotate = !autoRotate;
  $("#auto").classList.toggle("active", autoRotate);
};
function stopTour() {
  tourActive = false; clearTimeout(tourTimer); tourTimer = null;
  $("#tour").classList.remove("active");
  $("#tour").querySelector("span").textContent = "主线巡游";
}
function startTour() {
  if (tourActive) { stopTour(); return; }
  tourActive = true; tourIndex = 0;
  autoRotate = false; $("#auto").classList.remove("active");
  $("#tour").classList.add("active");
  $("#tour").querySelector("span").textContent = "停止巡游";
  const step = () => {
    if (!tourActive) return;
    if (tourIndex >= TOUR.length) { stopTour(); return; }
    const id = TOUR[tourIndex++];
    openNode(id, {focus:true});
    tourTimer = setTimeout(step, 2600);
  };
  step();
}
$("#tour").onclick = startTour;

/* 键盘 */
window.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "Escape") { closePanel(); stopTour(); }
  if (e.key === " ") { e.preventDefault(); autoRotate = !autoRotate; $("#auto").classList.toggle("active", autoRotate); }
  if (e.key.toLowerCase() === "r") resetView();
  if (e.key === "/") { e.preventDefault(); searchEl.focus(); }
});

/* 初始化统计 */
$("#stat-nodes").textContent = NODES.length;
$("#stat-links").textContent = edgeList.length;
$("#legend-count").textContent = CATS.length + " STAR SYSTEMS";

/* 默认打开一个节点，让页面不是空的 */
setTimeout(() => {
  if (window.innerWidth > 760) openNode("run", {focus:false});
}, 850);
</script>
</body>
