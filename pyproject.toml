[project]
name = "dataset-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-mongodb>=0.5.0",
    "loguru>=0.7.3",
    # 必须 <2：mcp 2.x 改用 server/discover 新握手（协议 2026-07-28），
    # 百炼 MCP 服务端仍是 2024-11-05 老协议，收到会回 HTTP 500 导致联网搜索全挂。
    # 由 openai-agents 间接依赖，故在此显式钉版本。
    "mcp<2",
    "minio>=7.2.20",
    "neo4j>=6.3.1",
    "openai-agents>=0.20.0",
    "pymilvus>=3.0.1",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    # 人工标注的用例集（eval/cases.yaml）是**手写**的，需要注释说明「这条为什么算 gold」——
    # JSON 表达不了注释，所以显式依赖 YAML。它此前只是被别的包间接带进来的，别靠传递依赖
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn>=0.52.2",
]
