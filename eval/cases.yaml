  # ⚠️ **标注时的坑**：这条切片很长，`worksheet` 默认只显示 500 字，音量那几格在截断之后。
  # 2026-10-10 我就因此错判成「文档里没有音量」，差点把这条用例删掉（用户拿实测结果指出来的）。
  # **判定前先 `show <id> --chars 3000` 看全文。**
