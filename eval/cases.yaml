# 评测用例集（评估路线 P2 · 人工标注）
#
# 这份文件是**手写**的：用例从真实提问里挑（`eval_cases candidates`），
# `gold_chunks` 由人读切片正文后判定（`eval_cases recall <问题>` 看候选、`show <id>` 读正文）。
# 工具在 app/core/eval_cases.py，四个命令：
#   check      校验格式 + gold 是否真的存在 + 标注进度
#   recall     检索一遍，列出可召回的切片（挑 gold 用）
#   show       打印切片正文（判断它是不是 gold）
#   rounds     两轮标注的一致率（规范要求 ≥ 90%）
#
# ── 字段 ──
#   id          短横线命名，全局唯一
#   question    原样的问题（多轮指代类用例要连同上文写清）
#   category    fact 精确事实 / steps 步骤 / descriptive 描述 / anaphora 指代 /
#               cross_doc 跨文档 / out_of_kb 库外
#               sensitive 敏感提问（期望被内容审核拦下）/ boundary 形态边界（只有产品名、空串、超长…）
#   doc         主要涉及的文档（file_title 原样；「库外」那类留空）
#   context     **指代类用例专用**：上一轮的用户提问（没有它，「它」指谁就无从判定，
#                gold 标不了、评测时也复现不了）
#   source      real 真实提问 / constructed 构造
#   gold_chunks **人工标注**：足以支撑答案全部要点的切片 id（可为多个；不确定就留空）
#   expect      期望（能填多少填多少，后面做断言时用）：
#               outcome / local_in_topk_min / images_min / must_mention / must_not_mention
#   cost_budget_yuan  单条成本上限
#
# ── 标注规范（先定规范，否则同一条题两个人标出不同结果）──
#   「正确」= 该切片**足以支撑答案的全部要点**；只沾边的**不算**。
#   同一个问题有多条切片都满足时，**全标上**（Recall@K 看的是「有没有捞到」，
#   不是「有没有恰好捞到那一条」）。
#   **留空 = 这条不参与召回率**（比如「库外」类、或指代类这种答案取决于上文的）——
#   不是「期望召回 0 条」。将来算 Recall@K 时按「跳过」处理，别把空集算成 0 分。
#   **同理**：`expect.outcome` 不是 `answered` 的用例（waiting_user / no_match / rejected…）
#   压根没走到「最终 Top-K」那一步，**它的 gold 也不参与 Recall@K** —— 那种 gold 是
#   「将来对齐修好了、这条就该命中它」的**意图记录**，不是当下的判据。
#   标注流程：先标 30 条 → **隔一天重标一遍**（另存 cases.round2.yaml）→
#   `rounds` 算一致率，< 90% 说明规范没写清，**先改规范再重标**。
#
#   当前进度：0/6 已标 gold（这只是起步样例，按 §3.3 的规模要到 45 条左右）

